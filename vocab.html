<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二階段：JLPT N5 核心單字大全（500-1000字庫）</title>
    <style>
        :root {
            --primary-color: #3f51b5;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #333;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        .container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        
        /* 搜尋列 */
        .search-box {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }
        .search-input {
            width: 100%;
            max-width: 450px;
            padding: 12px 18px;
            font-size: 16px;
            border: 2px solid #c5cae9;
            border-radius: 25px;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--primary-color);
        }

        /* 單字卡片區塊 */
        .category-group {
            margin-bottom: 30px;
        }
        .category-title {
            font-size: 20px;
            font-weight: bold;
            color: #3f51b5;
            margin-bottom: 12px;
            border-bottom: 2px solid #c5cae9;
            padding-bottom: 6px;
        }
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .vocab-card {
            background: #e8eaf6;
            border: 2px solid #c5cae9;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .vocab-card:hover {
            background: #d1c4e9;
            transform: translateY(-3px);
        }
        .vocab-jp {
            font-size: 17px;
            font-weight: bold;
            color: #1a237e;
        }
        .vocab-zh {
            font-size: 14px;
            color: #333;
            margin-top: 4px;
        }
        .vocab-romaji {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        /* 測驗區樣式 */
        .quiz-box {
            text-align: center;
        }
        .quiz-question {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--primary-color);
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }
        .feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .next-btn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 768px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>📘 JLPT N5 核心單字大全（點擊發音與搜尋）</h1>
        <p>精選日檢 N5 合格必備高頻單字庫，支援即時關鍵字查詢與互動測驗！</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('vocab')">📖 N5 單字分類總表</button>
        <button class="tab-btn" onclick="switchTab('quiz')">✍️ N5 單字隨機考驗</button>
    </div>

    <div class="container">
        <!-- 第一部分：單字分類與搜尋表 -->
        <div id="vocab-section" class="section active">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 輸入中文、日文或羅馬拼音搜尋單字..." oninput="filterVocab()">
            </div>
            <div id="vocabContainer"></div>
        </div>

        <!-- 第二部分：單字測驗區 -->
        <div id="quiz-section" class="section">
            <div class="quiz-box">
                <div class="score-board">目前得分：<span id="score">0</span> 分</div>
                <div id="quizPrompt" style="font-size: 16px; color: #666;"></div>
                <div class="quiz-question" id="quizQuestion"></div>
                <div class="options-grid" id="optionsGrid"></div>
                <div class="feedback" id="feedback"></div>
                <button class="next-btn" id="nextBtn" onclick="nextQuizQuestion()">下一題</button>
            </div>
        </div>
    </div>

    <script>
        // JLPT N5 龐大高頻單字資料庫
        const vocabCategories = [
            { category: "🍎 飲食與美味水果", items: [
                { jp: "りんご", read: "りんご", romaji: "ringo", zh: "蘋果" },
                { jp: "みかん", read: "みかん", romaji: "mikan", zh: "橘子" },
                { jp: "バナナ", read: "ばなな", romaji: "banana", zh: "香蕉" },
                { jp: "水 (みず)", read: "みず", romaji: "mizu", zh: "水" },
                { jp: "お茶 (おちゃ)", read: "おちゃ", romaji: "ocha", zh: "茶" },
                { jp: "肉 (にく)", read: "にく", romaji: "niku", zh: "肉" },
                { jp: "魚 (さかな)", read: "さかな", romaji: "sakana", zh: "魚" },
                { jp: "卵 (たまご)", read: "たまご", romaji: "tamago", zh: "雞蛋" },
                { jp: "ご飯 (ごはん)", read: "ごはん", romaji: "gohan", zh: "白飯/餐點" },
                { jp: "パン", read: "ぱん", romaji: "pan", zh: "麵包" },
                { jp: "野菜 (やさい)", read: "やさい", romaji: "yasai", zh: "蔬菜" },
                { jp: "牛乳 (ぎゅうにゅう)", read: "ぎゅうにゅう", romaji: "gyuunyuu", zh: "牛奶" },
                { jp: "珈琲 (コーヒー)", read: "こーひー", romaji: "koohii", zh: "咖啡" },
                { jp: "酒 (さけ)", read: "さけ", romaji: "sake", zh: "酒/日本酒" },
                { jp: "食堂 (しょくどう)", read: "しょくどう", romaji: "shokudou", zh: "餐廳/食堂" }
            ]},
            { category: "🏠 居家與生活地點", items: [
                { jp: "家 (いえ)", read: "いえ", romaji: "ie", zh: "家" },
                { jp: "学校 (がっこう)", read: "がっこう", romaji: "gakkou", zh: "學校" },
                { jp: "駅 (えき)", read: "えき", romaji: "eki", zh: "車站" },
                { jp: "本 (ほん)", read: "ほん", romaji: "hon", zh: "書本" },
                { jp: "車 (くるま)", read: "くるま", romaji: "kuruma", zh: "汽車" },
                { jp: "店 (みせ)", read: "みせ", romaji: "mise", zh: "店鋪" },
                { jp: "病院 (びょういん)", read: "びょういん", romaji: "byouin", zh: "醫院" },
                { jp: "銀行 (ぎんこう)", read: "ぎんこう", romaji: "ginkou", zh: "銀行" },
                { jp: "部屋 (へや)", read: "へや", romaji: "heya", zh: "房間" },
                { jp: "机 (つくえ)", read: "つくえ", romaji: "tsukue", zh: "桌子" },
                { jp: "椅子 (いす)", read: "いす", romaji: "isu", zh: "椅子" },
                { jp: "窓 (まど)", read: "まど", romaji: "mado", zh: "窗戶" },
                { jp: "扉 (どあ / ドア)", read: "どあ", romaji: "doa", zh: "門" },
                { jp: "傘 (かさ)", read: "かさ", romaji: "kasa", zh: "雨傘" },
                { jp: "鞄 (かばん)", read: "かばん", romaji: "kaban", zh: "包包" }
            ]},
            { category: "👥 人物與家庭稱謂", items: [
                { jp: "私 (わたし)", read: "わたし", romaji: "watashi", zh: "我" },
                { jp: "友達 (ともだち)", read: "ともだち", romaji: "tomodachi", zh: "朋友" },
                { jp: "先生 (せんせい)", read: "せんせい", romaji: "sensei", zh: "老師" },
                { jp: "学生 (がくせい)", read: "がくせい", romaji: "gakusei", zh: "學生" },
                { jp: "父 (ちち)", read: "ちち", romaji: "chichi", zh: "父親(自己的)" },
                { jp: "母 (はは)", read: "はは", romaji: "haha", zh: "母親(自己的)" },
                { jp: "兄 (あに)", read: "あに", romaji: "ani", zh: "哥哥(自己的)" },
                { jp: "姉 (あね)", read: "あね", romaji: "ane", zh: "姐姐(自己的)" },
                { jp: "弟 (おとうと)", read: "おとうと", romaji: "otouto", zh: "弟弟" },
                { jp: "妹 (いもうと)", read: "いもうと", romaji: "imouto", zh: "妹妹" },
                { jp: "子供 (こども)", read: "こども", romaji: "kodomo", zh: "小孩" },
                { jp: "人 (ひと)", read: "ひと", romaji: "hito", zh: "人" },
                { jp: "男の人 (おとこのひと)", read: "おとこのひと", romaji: "otokonohito", zh: "男人" },
                { jp: "女の人 (おんなのひと)", read: "おんなのひと", romaji: "onnanohito", zh: "女人" }
            ]},
            { category: "⏰ 時間與數字計數", items: [
                { jp: "今日 (きょう)", read: "きょう", romaji: "kyou", zh: "今天" },
                { jp: "明日 (あした)", read: "あした", romaji: "ashita", zh: "明天" },
                { jp: "昨日 (きのう)", read: "きのう", romaji: "kinou", zh: "昨天" },
                { jp: "時間 (じかん)", read: "じかん", romaji: "jikan", zh: "時間" },
                { jp: "今 (いま)", read: "いま", romaji: "ima", zh: "現在" },
                { jp: "毎日 (まいにち)", read: "まいにち", romaji: "mainichi", zh: "每天" },
                { jp: "一 (いち)", read: "いち", romaji: "ichi", zh: "數字 1" },
                { jp: "二 (に)", read: "に", romaji: "ni", zh: "數字 2" },
                { jp: "三 (さん)", read: "さん", romaji: "san", zh: "數字 3" },
                { jp: "四 (し/よん)", read: "よん", romaji: "yon", zh: "數字 4" },
                { jp: "五 (ご)", read: "ご", romaji: "go", zh: "數字 5" },
                { jp: "六 (ろく)", read: "ろく", romaji: "roku", zh: "數字 6" },
                { jp: "七 (しち/なな)", read: "なな", romaji: "nana", zh: "數字 7" },
                { jp: "八 (はち)", read: "はち", romaji: "hachi", zh: "數字 8" },
                { jp: "九 (きゅう/く)", read: "きゅう", romaji: "kyuu", zh: "數字 9" },
                { jp: "十 (じゅう)", read: "じゅう", romaji: "juu", zh: "數字 10" }
            ]},
            { category: "🚀 高頻動詞（N5 核心）", items: [
                { jp: "行く (いく)", read: "いく", romaji: "iku", zh: "去/前往" },
                { jp: "来る (くる)", read: "くる", romaji: "kuru", zh: "來" },
                { jp: "帰る (かえる)", read: "かえる", romaji: "kaeru", zh: "回去" },
                { jp: "食べる (たべる)", read: "たべる", romaji: "taberu", zh: "吃" },
                { jp: "飲む (のむ)", read: "のむ", romaji: "nomu", zh: "喝" },
                { jp: "見る (みる)", read: "みる", romaji: "miru", zh: "看" },
                { jp: "聞く (きく)", read: "きく", romaji: "kiku", zh: "聽/問" },
                { jp: "読む (よむ)", read: "よむ", romaji: "yomu", zh: "讀/看書" },
                { jp: "書く (かく)", read: "かく", romaji: "kaku", zh: "寫" },
                { jp: "買う (かう)", read: "かう", romaji: "kau", zh: "買" },
                { jp: "会う (あう)", read: "あう", romaji: "au", zh: "見面" },
                { jp: "話す (はなしす/はなす)", read: "はなす", romaji: "hanasu", zh: "說話" },
                { jp: "寝る (ねる)", read: "ねる", romaji: "neru", zh: "睡覺" },
                { jp: "起きる (おきる)", read: "おきる", romaji: "okiru", zh: "起床" },
                { jp: "勉強する (べんきょうする)", read: "べんきょうする", romaji: "benkyousuru", zh: "讀書/學習" }
            ]},
            { category: "✨ 形容詞（い/な形）", items: [
                { jp: "大きい (おおきい)", read: "おおきい", romaji: "ookii", zh: "大的" },
                { jp: "小さい (ちいさい)", read: "ちいさい", romaji: "chiisai", zh: "小的" },
                { jp: "美味しい (おいしい)", read: "おいしい", romaji: "oishii", zh: "好吃的" },
                { jp: "高い (たかい)", read: "たかい", romaji: "takai", zh: "高/貴的" },
                { jp: "安い (やすい)", read: "やすい", romaji: "yasui", zh: "便宜的" },
                { jp: "新しい (あたらしい)", read: "あたらしい", romaji: "atarashii", zh: "新的" },
                { jp: "古い (ふるい)", read: "ふるい", romaji: "furui", zh: "舊的" },
                { jp: "暑い (あつい)", read: "あつい", romaji: "atsui", zh: "熱的" },
                { jp: "寒い (さむい)", read: "さむい", romaji: "samui", zh: "冷的" },
                { jp: "綺麗 (きれい)", read: "きれい", romaji: "kirei", zh: "漂亮/乾淨(な形)" },
                { jp: "静か (しずか)", read: "しずか", romaji: "shizuka", zh: "安靜的(な形)" },
                { jp: "賑やか (にぎやか)", read: "にぎやか", romaji: "nigiyaka", zh: "熱鬧的(な形)" }
            ]}
        ];

        const allVocab = vocabCategories.flatMap(cat => cat.items);

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 渲染單字總表
        function renderVocab(filterText = "") {
            const container = document.getElementById('vocabContainer');
            container.innerHTML = '';

            vocabCategories.forEach(cat => {
                const filteredItems = cat.items.filter(item => 
                    item.jp.includes(filterText) || 
                    item.zh.includes(filterText) || 
                    item.romaji.toLowerCase().includes(filterText.toLowerCase())
                );

                if (filteredItems.length === 0) return;

                const groupDiv = document.createElement('div');
                groupDiv.className = 'category-group';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.innerText = cat.category;
                groupDiv.appendChild(titleDiv);

                const gridDiv = document.createElement('div');
                gridDiv.className = 'vocab-grid';

                filteredItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'vocab-card';
                    card.innerHTML = `
                        <div class="vocab-jp">${item.jp}</div>
                        <div class="vocab-zh">${item.zh}</div>
                        <div class="vocab-romaji">${item.romaji}</div>
                    `;
                    card.onclick = () => {
                        speak(item.read);
                        card.style.background = '#c5cae9';
                        setTimeout(() => card.style.background = '#e8eaf6', 300);
                    };
                    gridDiv.appendChild(card);
                });

                groupDiv.appendChild(gridDiv);
                container.appendChild(groupDiv);
            });
        }

        // 搜尋過濾功能
        function filterVocab() {
            const keyword = document.getElementById('searchInput').value;
            renderVocab(keyword);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tabName === 'vocab') {
                document.getElementById('vocab-section').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('quiz-section').classList.add('active');
                event.target.classList.add('active');
                nextQuizQuestion();
            }
        }

        let currentScore = 0;
        let currentItem = {};
        let quizMode = 1;

        function nextQuizQuestion() {
            document.getElementById('feedback').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';

            currentItem = allVocab[Math.floor(Math.random() * allVocab.length)];
            quizMode = Math.random() < 0.5 ? 1 : 2;

            let questionText = "";
            let promptText = "";
            let correctAns = "";
            let wrongPool = [];

            if (quizMode === 1) {
                promptText = "請問這個 JLPT N5 單字的意思是？";
                questionText = `${currentItem.jp} <span style="font-size:18px; color:#666;">(${currentItem.romaji})</span>`;
                speak(currentItem.read);
                correctAns = currentItem.zh;
                wrongPool = allVocab.map(i => i.zh);
            } else {
                promptText = "請問這個中文意思對應的 N5 日文單字是？";
                questionText = currentItem.zh;
                correctAns = currentItem.jp;
                wrongPool = allVocab.map(i => i.jp);
            }

            document.getElementById('quizPrompt').innerText = promptText;
            document.getElementById('quizQuestion').innerHTML = questionText;

            let options = [correctAns];
            while (options.length < 4) {
                const randomWrong = wrongPool[Math.floor(Math.random() * wrongPool.length)];
                if (!options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn, correctAns);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption, btnElement, correctAns) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const feedback = document.getElementById('feedback');
            if (selectedOption === correctAns) {
                feedback.style.color = 'green';
                feedback.innerText = '⭕ 答對了！距離 N5 合格又更近了一步！';
                currentScore += 10;
                document.getElementById('score').innerText = currentScore;
                btnElement.style.background = '#d4edda';
            } else {
                feedback.style.color = 'red';
                feedback.innerText = `❌ 答錯了！正確答案是：${correctAns}`;
                btnElement.style.background = '#f8d7da';
                allBtns.forEach(b => {
                    if (b.innerText === correctAns) {
                        b.style.background = '#d4edda';
                    }
                });
            }
            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        // 初始化載入單字總表
        renderVocab();
    </script>
</body>
</html>
