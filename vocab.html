<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二階段：JLPT N5 核心單字圖卡網</title>
    <style>
        :root {
            --primary-color: #3f51b5;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #333;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        .container {
            width: 100%;
            max-width: 1150px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }

        /* 主題分類大卡片 */
        .category-menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .category-menu-card {
            background: linear-gradient(135deg, #e8eaf6 0%, #c5cae9 100%);
            border: 2px solid #9fa8da;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .category-menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(63, 81, 181, 0.2);
        }
        .menu-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .menu-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a237e;
        }
        .menu-count {
            font-size: 13px;
            color: #555;
            margin-top: 5px;
        }

        /* 子單字列表畫面 */
        .back-btn {
            background-color: #757575;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .back-btn:hover {
            background-color: #616161;
        }
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .vocab-card {
            background: #fafafa;
            border: 2px solid #c5cae9;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .vocab-card:hover {
            background: #e8eaf6;
            transform: translateY(-3px);
        }
        .vocab-jp {
            font-size: 17px;
            font-weight: bold;
            color: #1a237e;
        }
        .vocab-zh {
            font-size: 14px;
            color: #333;
            margin-top: 4px;
        }
        .vocab-romaji {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        /* 彈跳視窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }
        .close-btn:hover {
            color: #000;
        }
        .modal-word {
            font-size: 28px;
            font-weight: bold;
            color: #3f51b5;
        }
        .modal-romaji {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .modal-zh {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            margin-top: 10px;
        }
        .sentence-box {
            background: #f1f8e9;
            border-left: 4px solid #8bc34a;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        .sentence-box:hover {
            background: #e8f5e9;
        }
        .st-jp {
            font-size: 16px;
            font-weight: bold;
            color: #1b5e20;
        }
        .st-zh {
            font-size: 14px;
            color: #555;
            margin-top: 4px;
        }

        /* 測驗區樣式 */
        .quiz-box {
            text-align: center;
        }
        .quiz-question {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--primary-color);
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }
        .feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .next-btn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 768px) {
            .category-menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    <!-- 引入獨立的完整單字資料庫 -->
    <script src="js/vocab-data.js"></script>
</head>
<body>

    <header>
        <h1>📘 JLPT N5 核心單字圖卡與例句網</h1>
        <p>點擊主題卡片深入學習單字與專屬例句，支援語音朗讀與隨機測驗！</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tabMenuBtn" onclick="switchMainTab('menu')">🗂️ 主題分類圖卡庫</button>
        <button class="tab-btn" id="tabQuizBtn" onclick="switchMainTab('quiz')">✍️ 單字隨機測驗挑戰</button>
    </div>

    <div class="container">
        <!-- 第一部分主畫面：分類圖卡主選單 -->
        <div id="main-menu-section" class="section active">
            <h3 id="totalCategoryCount" style="margin-bottom: 20px; color: #3f51b5;">載入中...</h3>
            <div class="category-menu-grid" id="categoryMenuGrid"></div>
        </div>

        <!-- 第二部分子畫面：單一分類的單字清單 -->
        <div id="category-detail-section" class="section">
            <button class="back-btn" onclick="backToMenu()">⬅️ 返回主題分類選單</button>
            <h2 id="detailCategoryTitle" style="color: #3f51b5; margin-bottom: 15px;"></h2>
            <div class="vocab-grid" id="vocabDetailGrid"></div>
        </div>

        <!-- 第三部分：單字隨機測驗區 -->
        <div id="quiz-section" class="section">
            <div class="quiz-box">
                <div class="score-board">目前得分：<span id="score">0</span> 分</div>
                <div id="quizPrompt" style="font-size: 16px; color: #666;"></div>
                <div class="quiz-question" id="quizQuestion"></div>
                <div class="options-grid" id="optionsGrid"></div>
                <div class="feedback" id="feedback"></div>
                <button class="next-btn" id="nextBtn" onclick="nextQuizQuestion()">下一題</button>
            </div>
        </div>
    </div>

    <!-- 單字例句彈跳視窗 -->
    <div id="wordModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-word" id="modalJp"></div>
            <div class="modal-romaji" id="modalRomaji"></div>
            <div class="modal-zh" id="modalZh"></div>
            <div style="margin-top: 15px; font-size: 13px; color: #888;">🔊 點擊下方例句可聽發音</div>
            <div class="sentence-box" id="modalSentenceBox" onclick="speakModalSentence()">
                <div class="st-jp" id="modalStJp"></div>
                <div class="st-zh" id="modalStZh"></div>
            </div>
        </div>
    </div>

    <script>
        const allVocab = vocabCategories.flatMap(cat => cat.items);

        // 動態計算並顯示總單字量
        document.getElementById('totalCategoryCount').innerText = `📊 目前資料庫共收錄 ${allVocab.length} 個 JLPT N5 核心單字與例句，請選擇主題：`;

        // 語音播放函數
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 初始化主選單分類卡片
        const menuGrid = document.getElementById('categoryMenuGrid');
        vocabCategories.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'category-menu-card';
            card.innerHTML = `
                <div class="menu-icon">${cat.icon}</div>
                <div class="menu-title">${cat.name}</div>
                <div class="menu-count">包含 ${cat.items.length} 個單字與例句</div>
            `;
            card.onclick = () => openCategoryDetail(cat);
            menuGrid.appendChild(card);
        });

        // 點擊分類卡片，切換到該分類的詳細單字畫面
        function openCategoryDetail(cat) {
            document.getElementById('main-menu-section').classList.remove('active');
            document.getElementById('category-detail-section').classList.add('active');
            
            document.getElementById('detailCategoryTitle').innerText = `${cat.icon} ${cat.name}（共 ${cat.items.length} 個）`;
            
            const detailGrid = document.getElementById('vocabDetailGrid');
            detailGrid.innerHTML = '';

            cat.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="vocab-jp">${item.jp}</div>
                    <div class="vocab-zh">${item.zh}</div>
                    <div class="vocab-romaji">${item.romaji}</div>
                `;
                card.onclick = () => {
                    speak(item.read);
                    showWordModal(item);
                };
                detailGrid.appendChild(card);
            });
        }

        // 顯示單字例句彈跳視窗
        let currentModalItem = {};
        function showWordModal(item) {
            currentModalItem = item;
            document.getElementById('modalJp').innerText = item.jp;
            document.getElementById('modalRomaji').innerText = item.romaji;
            document.getElementById('modalZh').innerText = item.zh;
            document.getElementById('modalStJp').innerText = `🔊 例句：${item.stJp}`;
            document.getElementById('modalStZh').innerText = item.stZh;
            document.getElementById('wordModal').style.display = 'flex';
        }

        // 關閉彈跳視窗
        function closeModal() {
            document.getElementById('wordModal').style.display = 'none';
        }

        // 朗讀彈跳視窗中的例句
        function speakModalSentence() {
            if (currentModalItem.stRead) {
                speak(currentModalItem.stRead);
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('wordModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function backToMenu() {
            document.getElementById('category-detail-section').classList.remove('active');
            document.getElementById('main-menu-section').classList.add('active');
        }

        function switchMainTab(tabName) {
            document.querySelectorAll('.container > .section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('tabMenuBtn').classList.remove('active');
            document.getElementById('tabQuizBtn').classList.remove('active');

            if (tabName === 'menu') {
                document.getElementById('main-menu-section').classList.add('active');
                document.getElementById('tabMenuBtn').classList.add('active');
            } else {
                document.getElementById('quiz-section').classList.add('active');
                document.getElementById('tabQuizBtn').classList.add('active');
                nextQuizQuestion();
            }
        }

        let currentScore = 0;
        let currentItem = {};
        let quizMode = 1;

        function nextQuizQuestion() {
            document.getElementById('feedback').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';

            currentItem = allVocab[Math.floor(Math.random() * allVocab.length)];
            quizMode = Math.random() < 0.5 ? 1 : 2;

            let questionText = "";
            let promptText = "";
            let correctAns = "";
            let wrongPool = [];

            if (quizMode === 1) {
                promptText = "請問這個 JLPT N5 單字的意思是？";
                questionText = `${currentItem.jp} <span style="font-size:18px; color:#666;">(${currentItem.romaji})</span>`;
                speak(currentItem.read);
                correctAns = currentItem.zh;
                wrongPool = allVocab.map(i => i.zh);
            } else {
                promptText = "請問這個中文意思對應的 N5 日文單字是？";
                questionText = currentItem.zh;
                correctAns = currentItem.jp;
                wrongPool = allVocab.map(i => i.jp);
            }

            document.getElementById('quizPrompt').innerText = promptText;
            document.getElementById('quizQuestion').innerHTML = questionText;

            let options = [correctAns];
            while (options.length < 4) {
                const randomWrong = wrongPool[Math.floor(Math.random() * wrongPool.length)];
                if (!options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn, correctAns);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption, btnElement, correctAns) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const feedback = document.getElementById('feedback');
            if (selectedOption === correctAns) {
                feedback.style.color = 'green';
                feedback.innerText = '⭕ 答對了！太棒了！';
                currentScore += 10;
                document.getElementById('score').innerText = currentScore;
                btnElement.style.background = '#d4edda';
            } else {
                feedback.style.color = 'red';
                feedback.innerText = `❌ 答錯了！正確答案是：${correctAns}`;
                btnElement.style.background = '#f8d7da';
                allBtns.forEach(b => {
                    if (b.innerText === correctAns) {
                        b.style.background = '#c8e6c9';
                    }
                });
            }
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    </script>
</body>
</html>
