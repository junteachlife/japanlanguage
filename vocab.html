    <style>
        :root {
            --primary-color: #3f51b5;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #333;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        .container {
            width: 100%;
            max-width: 1150px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }

        /* 主題分類大卡片（首頁主選單） */
        .category-menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .category-menu-card {
            background: linear-gradient(135deg, #e8eaf6 0%, #c5cae9 100%);
            border: 2px solid #9fa8da;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .category-menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(63, 81, 181, 0.2);
        }
        .menu-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .menu-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a237e;
        }
        .menu-count {
            font-size: 13px;
            color: #555;
            margin-top: 5px;
        }

        /* 子單字列表畫面 */
        .back-btn {
            background-color: #757575;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .back-btn:hover {
            background-color: #616161;
        }
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .vocab-card {
            background: #fafafa;
            border: 2px solid #c5cae9;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .vocab-card:hover {
            background: #e8eaf6;
            transform: translateY(-3px);
        }
        .vocab-jp {
            font-size: 17px;
            font-weight: bold;
            color: #1a237e;
        }
        .vocab-zh {
            font-size: 14px;
            color: #333;
            margin-top: 4px;
        }
        .vocab-romaji {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        /* 測驗區樣式 */
        .quiz-box {
            text-align: center;
        }
        .quiz-question {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--primary-color);
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }
        .feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .next-btn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 768px) {
            .category-menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

        // 語音播放函數
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 初始化主選單分類卡片
        const menuGrid = document.getElementById('categoryMenuGrid');
        vocabCategories.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'category-menu-card';
            card.innerHTML = `
                <div class="menu-icon">${cat.icon}</div>
                <div class="menu-title">${cat.name}</div>
                <div class="menu-count">包含 ${cat.items.length} 個單字</div>
            `;
            card.onclick = () => openCategoryDetail(cat);
            menuGrid.appendChild(card);
        });

        // 點擊分類卡片，切換到該分類的詳細單字畫面
        function openCategoryDetail(cat) {
            document.getElementById('main-menu-section').classList.remove('active');
            document.getElementById('category-detail-section').classList.add('active');
            
            document.getElementById('detailCategoryTitle').innerText = `${cat.icon} ${cat.name}（共 ${cat.items.length} 個）`;
            
            const detailGrid = document.getElementById('vocabDetailGrid');
            detailGrid.innerHTML = '';

            cat.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="vocab-jp">${item.jp}</div>
                    <div class="vocab-zh">${item.zh}</div>
                    <div class="vocab-romaji">${item.romaji}</div>
                `;
                card.onclick = () => {
                    speak(item.read);
                    card.style.background = '#c5cae9';
                    setTimeout(() => card.style.background = '#fafafa', 300);
                };
                detailGrid.appendChild(card);
            });
        }

        // 從分類詳細頁返回主選單
        function backToMenu() {
            document.getElementById('category-detail-section').classList.remove('active');
            document.getElementById('main-menu-section').classList.add('active');
        }

        // 切換主頁籤（選單 vs 隨機測驗）
        function switchMainTab(tabName) {
            document.querySelectorAll('.container > .section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('tabMenuBtn').classList.remove('active');
            document.getElementById('tabQuizBtn').classList.remove('active');

            if (tabName === 'menu') {
                document.getElementById('main-menu-section').classList.add('active');
                document.getElementById('tabMenuBtn').classList.add('active');
            } else {
                document.getElementById('quiz-section').classList.add('active');
                document.getElementById('tabQuizBtn').classList.add('active');
                nextQuizQuestion();
            }
        }

        // 測驗變數
        let currentScore = 0;
        let currentItem = {};
        let quizMode = 1;

        function nextQuizQuestion() {
            document.getElementById('feedback').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';

            currentItem = allVocab[Math.floor(Math.random() * allVocab.length)];
            quizMode = Math.random() < 0.5 ? 1 : 2;

            let questionText = "";
            let promptText = "";
            let correctAns = "";
            let wrongPool = [];

            if (quizMode === 1) {
                promptText = "請問這個 JLPT N5 單字的意思是？";
                questionText = `${currentItem.jp} <span style="font-size:18px; color:#666;">(${currentItem.romaji})</span>`;
                speak(currentItem.read);
                correctAns = currentItem.zh;
                wrongPool = allVocab.map(i => i.zh);
            } else {
                promptText = "請問這個中文意思對應的 N5 日文單字是？";
                questionText = currentItem.zh;
                correctAns = currentItem.jp;
                wrongPool = allVocab.map(i => i.jp);
            }

            document.getElementById('quizPrompt').innerText = promptText;
            document.getElementById('quizQuestion').innerHTML = questionText;

            let options = [correctAns];
            while (options.length < 4) {
                const randomWrong = wrongPool[Math.floor(Math.random() * wrongPool.length)];
                if (!options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn, correctAns);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption, btnElement, correctAns) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const feedback = document.getElementById('feedback');
            if (selectedOption === correctAns) {
                feedback.style.color = 'green';
                feedback.innerText = '⭕ 答對了！太棒了！';
                currentScore += 10;
                document.getElementById('score').innerText = currentScore;
                btnElement.style.background = '#d4edda';
            } else {
                feedback.style.color = 'red';
                feedback.innerText = `❌ 答錯了！正確答案是：${correctAns}`;
                btnElement.style.background = '#f8d7da';
                allBtns.forEach(b => {
                    if (b.innerText === correctAns) {
                        b.style.background = '#d4edda';
                    }
                });
            }
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
