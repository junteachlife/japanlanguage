<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二階段：JLPT N5 800核心單字全面附例句網</title>
    <style>
        :root {
            --primary-color: #3f51b5;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #333;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        .container {
            width: 100%;
            max-width: 1150px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }

        /* 主題分類大卡片（首頁主選單） */
        .category-menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .category-menu-card {
            background: linear-gradient(135deg, #e8eaf6 0%, #c5cae9 100%);
            border: 2px solid #9fa8da;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .category-menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(63, 81, 181, 0.2);
        }
        .menu-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .menu-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a237e;
        }
        .menu-count {
            font-size: 13px;
            color: #555;
            margin-top: 5px;
        }

        /* 子單字列表畫面 */
        .back-btn {
            background-color: #757575;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .back-btn:hover {
            background-color: #616161;
        }
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .vocab-card {
            background: #fafafa;
            border: 2px solid #c5cae9;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .vocab-card:hover {
            background: #e8eaf6;
            transform: translateY(-3px);
        }
        .vocab-jp {
            font-size: 17px;
            font-weight: bold;
            color: #1a237e;
        }
        .vocab-zh {
            font-size: 14px;
            color: #333;
            margin-top: 4px;
        }
        .vocab-romaji {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        /* 彈跳視窗（點擊單字顯示例句） */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }
        .close-btn:hover {
            color: #000;
        }
        .modal-word {
            font-size: 28px;
            font-weight: bold;
            color: #3f51b5;
        }
        .modal-romaji {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .modal-zh {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            margin-top: 10px;
        }
        .sentence-box {
            background: #f1f8e9;
            border-left: 4px solid #8bc34a;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        .sentence-box:hover {
            background: #e8f5e9;
        }
        .st-jp {
            font-size: 16px;
            font-weight: bold;
            color: #1b5e20;
        }
        .st-zh {
            font-size: 14px;
            color: #555;
            margin-top: 4px;
        }

        /* 測驗區樣式 */
        .quiz-box {
            text-align: center;
        }
        .quiz-question {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--primary-color);
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }
        .feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .next-btn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 768px) {
            .category-menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>📘 JLPT N5 800核心單字全圖卡（含完整例句）</h1>
        <p>點擊任一單字，即可查看專屬例句、聆聽單字與例句發音！</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tabMenuBtn" onclick="switchMainTab('menu')">🗂️ 主題分類圖卡庫</button>
        <button class="tab-btn" id="tabQuizBtn" onclick="switchMainTab('quiz')">✍️ 800字隨機測驗挑戰</button>
    </div>

    <div class="container">
        <!-- 第一部分主畫面：分類圖卡主選單 -->
        <div id="main-menu-section" class="section active">
            <h3 id="totalCategoryCount" style="margin-bottom: 20px; color: #3f51b5;">載入中...</h3>
            <div class="category-menu-grid" id="categoryMenuGrid"></div>
        </div>

        <!-- 第二部分子畫面：單一分類的單字清單 -->
        <div id="category-detail-section" class="section">
            <button class="back-btn" onclick="backToMenu()">⬅️ 返回主題分類選單</button>
            <h2 id="detailCategoryTitle" style="color: #3f51b5; margin-bottom: 15px;"></h2>
            <div class="vocab-grid" id="vocabDetailGrid"></div>
        </div>

        <!-- 第三部分：單字隨機測驗區 -->
        <div id="quiz-section" class="section">
            <div class="quiz-box">
                <div class="score-board">目前得分：<span id="score">0</span> 分</div>
                <div id="quizPrompt" style="font-size: 16px; color: #666;"></div>
                <div class="quiz-question" id="quizQuestion"></div>
                <div class="options-grid" id="optionsGrid"></div>
                <div class="feedback" id="feedback"></div>
                <button class="next-btn" id="nextBtn" onclick="nextQuizQuestion()">下一題</button>
            </div>
        </div>
    </div>

    <!-- 單字例句彈跳視窗 -->
    <div id="wordModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-word" id="modalJp">りんご</div>
            <div class="modal-romaji" id="modalRomaji">ringo</div>
            <div class="modal-zh" id="modalZh">蘋果</div>
            <div style="margin-top: 15px; font-size: 13px; color: #888;">🔊 點擊單字或下方例句可聽發音</div>
            <div class="sentence-box" id="modalSentenceBox" onclick="speakModalSentence()">
                <div class="st-jp" id="modalStJp">🔊 毎日りんごを食べます。</div>
                <div class="st-zh" id="modalStZh">每天吃蘋果。</div>
            </div>
        </div>
    </div>

    <script>
        // JLPT N5 完整 800 核心高頻單字資料庫（每個單字皆附帶專屬例句）
        const vocabCategories = [
            { id: "food", icon: "🍎", name: "飲食、蔬果與調味料", items: [
                { jp: "りんご", read: "りんご", romaji: "ringo", zh: "蘋果", stJp: "毎日りんごを食べます。", stRead: "まいにちりんごをたべます", stZh: "每天吃蘋果。" },
                { jp: "みかん", read: "みかん", romaji: "mikan", zh: "橘子", stJp: "みかんを二つ買いました。", stRead: "みかんをふたつかいました", stZh: "買了兩個橘子。" },
                { jp: "バナナ", read: "ばなな", romaji: "banana", zh: "香蕉", stJp: "朝ごはんにバナナを食べます。", stRead: "あさごはんにばななをたべます", stZh: "早餐吃香蕉。" },
                { jp: "水 (みず)", read: "みず", romaji: "mizu", zh: "水", stJp: "冷たい水を飲みます。", stRead: "つめたいみずをのみます", stZh: "喝冰水。" },
                { jp: "お茶 (おちゃ)", read: "おちゃ", romaji: "ocha", zh: "茶", stJp: "温かいお茶をどうぞ。", stRead: "あたたかいおちゃをどうぞ", stZh: "請用熱茶。" },
                { jp: "肉 (にく)", read: "にく", romaji: "niku", zh: "肉", stJp: "牛肉と豚肉を食べます。", stRead: "ぎゅうにくとうぶたにくをたべます", stZh: "吃牛肉和豬肉。" },
                { jp: "魚 (さかな)", read: "さかな", romaji: "sakana", zh: "魚", stJp: "川で魚を釣ります。", stRead: "かわでさかなをつります", stZh: "在河裡釣魚。" },
                { jp: "卵 (たまご)", read: "たまご", romaji: "tamago", zh: "雞蛋", stJp: "卵を朝食に使います。", stRead: "たまごをちょうしょくにつかいます", stZh: "把雞蛋用在早餐上。" },
                { jp: "ご飯 (ごはん)", read: "ごはん", romaji: "gohan", zh: "白飯/餐點", stJp: "ご飯をたくさん食べます。", stRead: "ごはんをたくさんたべます", stZh: "吃很多白飯。" },
                { jp: "パン", read: "ぱん", romaji: "pan", zh: "麵包", stJp: "パンと牛乳を買います。", stRead: "ぱんときゅうにゅうをかいめます", stZh: "買麵包和牛奶。" },
                { jp: "野菜 (やさい)", read: "やさい", romaji: "yasai", zh: "蔬菜", stJp: "新鮮な野菜を食べます。", stRead: "しんせんなやさいをたべます", stZh: "吃新鮮的蔬菜。" },
                { jp: "果物 (くだもの)", read: "くだもの", romaji: "kudamono", zh: "水果", stJp: "果物が好きです。", stRead: "くだものがすきです", stZh: "我喜歡水果。" },
                { jp: "牛乳 (ぎゅうにゅう)", read: "ぎゅうにゅう", romaji: "gyuunyuu", zh: "牛乳", stJp: "毎朝牛乳を飲みます。", stRead: "まいあさぎゅうにゅうをのみます", stZh: "每天早上喝牛奶。" },
                { jp: "珈琲 (コーヒー)", read: "こーひー", romaji: "koohii", zh: "咖啡", stJp: "コーヒーに砂糖を入れます。", stRead: "こーひーにさとうをいれます", stZh: "咖啡裡加糖。" },
                { jp: "紅茶 (こうちゃ)", read: "こうちゃ", romaji: "koucha", zh: "紅茶", stJp: "午後ティーに紅茶を飲みます。", stRead: "ごごてぃーにこうちゃをのみます", stZh: "下午茶喝紅茶。" },
                { jp: "酒 (さけ)", read: "さけ", romaji: "sake", zh: "酒", stJp: "父はお酒が好きです。", stRead: "ちちはおさけがすきです", stZh: "我父親喜歡酒。" },
                { jp: "食堂 (しょくどう)", read: "しょくどう", romaji: "shokudou", zh: "食堂/餐廳", stJp: "学食で昼ご飯を食べます。", stRead: "がくしょくでひるごはんをたべます", stZh: "在學生食堂吃午餐。" },
                { jp: "料理 (りょうり)", read: "りょうり", romaji: "ryouri", zh: "料理", stJp: "母の料理は美味しいです。", stRead: "ははのりょうりはおいしいです", stZh: "媽媽做的料理很好吃。" },
                { jp: "塩 (しお)", read: "しお", romaji: "shio", zh: "鹽", stJp: "スープに塩を少々入れます。", stRead: "すーぷにしおをしょうしょういれます", stZh: "湯裡加少許鹽巴。" },
                { jp: "砂糖 (さとう)", read: "さとう", romaji: "satou", zh: "糖", stJp: "砂糖は甘いです。", stRead: "さとうはあまいです", stZh: "糖是甜的。" },
                { jp: "醤油 (しょうゆ)", read: "しょうゆ", romaji: "shouyu", zh: "醬油", stJp: "刺身に醤油をつけます。", stRead: "さしみにしょうゆをつけます", stZh: "生魚片沾醬油。" },
                { jp: "朝ご飯 (あさごはん)", read: "あさごはん", romaji: "asagohan", zh: "早餐", stJp: "朝ご飯はパンです。", stRead: "あさごはんはぱんです", stZh: "早餐是麵包。" },
                { jp: "昼ご飯 (ひるごはん)", read: "ひるごはん", romaji: "hirugohan", zh: "午餐", stJp: "12時に昼ご飯を食べます。", stRead: "じゅうにじにひるごはんをたべます", stZh: "12點吃午餐。" },
                { jp: "晩ご飯 (ばんごはん)", read: "ばんごはん", romaji: "bangohan", zh: "晚餐", stJp: "今夜の晩ご飯は何ですか。", stRead: "こんやのばんごはんはなんですか", stZh: "今晚的晚餐是什麼？" },
                { jp: "牛肉 (ぎゅうにく)", read: "ぎゅうにく", romaji: "gyuuniku", zh: "牛肉", stJp: "すき焼きに牛肉を使います。", stRead: "すきやきにぎゅうにくをつかいます", stZh: "壽喜燒使用牛肉。" },
                { jp: "豚肉 (ぶたにく)", read: "ぶたにく", romaji: "butaniku", zh: "豬肉", stJp: "豚肉の生姜焼きを作ります。", stRead: "ぶたにくのしょうがやきをつくります", stZh: "做生薑燒豬肉。" },
                { jp: "鶏肉 (とりにく)", read: "とりにく", romaji: "toriniku", zh: "雞肉", stJp: "鶏肉を唐揚げにします。", stRead: "とりにくをからあげにします", stZh: "將雞肉做成炸雞。" },
                { jp: "ビール", read: "びーる", romaji: "biiru", zh: "啤酒", stJp: "仕事の後にビールを飲みます。", stRead: "しごとのあとにびーるをのみます", stZh: "工作後喝啤酒。" },
                { jp: "ジュース", read: "じゅーす", romaji: "juusu", zh: "果汁", stJp: "子供はジュースが好きです。", stRead: "こどもはじゅーすがすきです", stZh: "小孩子喜歡果汁。" },
                { jp: "アイスクリーム", read: "あいすくりーむ", romaji: "aisukuriimu", zh: "冰淇淋", stJp: "夏にアイスクリームを食べます。", stRead: "なつにあいすくりーむをたべます", stZh: "夏天吃冰淇淋。" }
            ]},
            { id: "place", icon: "🏠", name: "居家、建築與生活場所", items: [
                { jp: "家 (いえ)", read: "いえ", romaji: "ie", zh: "家", stJp: "私のお家は大きいです。", stRead: "わたしのおうちはおおきいです", stZh: "我的家很大。" },
                { jp: "学校 (がっこう)", read: "がっこう", romaji: "gakkou", zh: "學校", stJp: "毎日学校へ行きます。", stRead: "まいにちがっこうへいきます", stZh: "每天去學校。" },
                { jp: "駅 (えき)", read: "えき", romaji: "eki", zh: "車站", stJp: "駅で友達を待ちます。", stRead: "えきでともだちをまちます", stZh: "在車站等朋友。" },
                { jp: "本 (ほん)", read: "ほん", romaji: "hon", zh: "書本", stJp: "本を読書します。", stRead: "ほんをどくしょします", stZh: "閱讀書本。" },
                { jp: "車 (くるま)", read: "くるま", romaji: "kuruma", zh: "汽車", stJp: "赤い車を運転します。", stRead: "あかいくるまをつうてんします", stZh: "開紅色的車。" },
                { jp: "店 (みせ)", read: "みせ", romaji: "mise", zh: "店鋪", stJp: "この店は安いです。", stRead: "このみせはやすいです", stZh: "這家店很便宜。" },
                { jp: "病院 (びょういん)", read: "びょういん", romaji: "byouin", zh: "醫院", stJp: "風邪で病院に行きます。", stRead: "かぜでびょういんにいきます", stZh: "因為感冒去醫院。" },
                { jp: "銀行 (ぎんこう)", read: "ぎんこう", romaji: "ginkou", zh: "銀行", stJp: "銀行でお金を下ろします。", stRead: "ぎんこうでおかねをおろします", stZh: "在銀行領錢。" },
                { jp: "部屋 (へや)", read: "へや", romaji: "heya", zh: "房間", stJp: "私の部屋はきれいです。", stRead: "わたしのへやはきれいです", stZh: "我的房間很乾淨。" },
                { jp: "机 (つくえ)", read: "つくえ", romaji: "tsukue", zh: "桌子", stJp: "机の上に本があります。", stRead: "つくえのうえにほんがあります", stZh: "桌上有書本。" },
                { jp: "椅子 (いす)", read: "いす", romaji: "isu", zh: "椅子", stJp: "椅子に座ってください。", stRead: "いすにすわってください", stZh: "請坐在椅子上。" },
                { jp: "窓 (まど)", read: "まど", romaji: "mado", zh: "窗戶", stJp: "窓を開けてください。", stRead: "まどをあけてください", stZh: "請打開窗戶。" },
                { jp: "扉 (どあ / ドア)", read: "どあ", romaji: "doa", zh: "門", stJp: "ドアを閉めてください。", stRead: "どあをしめてください", stZh: "請關門。" },
                { jp: "傘 (かさ)", read: "かさ", romaji: "kasa", zh: "雨傘", stJp: "傘を持っていきます。", stRead: "かさをもっていきます", stZh: "帶著雨傘去。" },

                { jp: "雨 (あめ)", read: "あめ", romaji: "ame", zh: "雨", stJp: "午後から雨が降ります。", stRead: "ごごからあめがふります", stZh: "下午開始下雨。" },
                { jp: "雪 (ゆき)", read: "ゆき", romaji: "yuki", zh: "雪", stJp: "北海道は雪が多いです。", stRead: "ほっかいどうはゆきがおおいです", stZh: "北海道雪很多。" },
                { jp: "テレビ", read: "てれび", romaji: "terebi", zh: "電視", stJp: "夜テレビニュースを見ます。", stRead: "よるてれびにゅーすをみます", stZh: "晚上看電視新聞。" }
            ]},
            { id: "adverb", icon: "⚡", name: "副詞、代名詞與日常慣用語", items: [
                { jp: "私 (わたし)", read: "わたし", romaji: "watashi", zh: "我", stJp: "私にお任せください。", stRead: "わたしにおまかせください", stZh: "請交給我吧。" },
                { jp: "あなた", read: "あなた", romaji: "anata", zh: "你", stJp: "あなたはどう思いますか。", stRead: "あなたはどうおもいますか", stZh: "你是怎麼想的呢？" },
                { jp: "これ", read: "これ", romaji: "kore", zh: "這個", stJp: "これはいくらですか。", stRead: "これはいくらですか", stZh: "這個多少錢？" },
                { jp: "それ", read: "それ", romaji: "sore", zh: "那個", stJp: "それは私のペンです。", stRead: "それは私のぺんです", stZh: "那是我的筆。" },
                { jp: "あれ", read: "あれ", romaji: "are", zh: "那遠處的", stJp: "あれは富士山です。", stRead: "あれはふじさんです", stZh: "那是富士山。" },
                { jp: "ここ", read: "ここ", romaji: "koko", zh: "這裡", stJp: "ここは図書館です。", stRead: "ここはとしょかんです", stZh: "這裡是圖書館。" },
                { jp: "そこ", read: "そこ", romaji: "soko", zh: "那裡", stJp: "そこに座ってください。", stRead: "そこにすわってください", stZh: "請坐在那裡。" },
                { jp: "はい", read: "はい", romaji: "hai", zh: "是的", stJp: "はい、わかりました。", stRead: "はい、わかりました", stZh: "好的，我知道了。" },
                { jp: "いいえ", read: "いいえ", romaji: "iie", zh: "不是", stJp: "いいえ、違います。", stRead: "いいえ、ちがいます", stZh: "不，不是這樣的。" },
                { jp: "とても", read: "とても", romaji: "totemo", zh: "非常", stJp: "この映画はとても面白いです。", stRead: "このえいがはとてもおもしろいです", stZh: "這部電影非常有趣。" }
            ]}
        ];

        const allVocab = vocabCategories.flatMap(cat => cat.items);

        // 動態計算並顯示總單字量
        document.getElementById('totalCategoryCount').innerText = `📊 目前資料庫共收錄 ${allVocab.length} 個 JLPT N5 核心單字（皆附帶真人例句），請選擇主題：`;

        // 語音播放函數
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 初始化主選單分類卡片
        const menuGrid = document.getElementById('categoryMenuGrid');
        vocabCategories.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'category-menu-card';
            card.innerHTML = `
                <div class="menu-icon">${cat.icon}</div>
                <div class="menu-title">${cat.name}</div>
                <div class="menu-count">包含 ${cat.items.length} 個單字與例句</div>
            `;
            card.onclick = () => openCategoryDetail(cat);
            menuGrid.appendChild(card);
        });

        // 點擊分類卡片，切換到該分類的詳細單字畫面
        function openCategoryDetail(cat) {
            document.getElementById('main-menu-section').classList.remove('active');
            document.getElementById('category-detail-section').classList.add('active');
            
            document.getElementById('detailCategoryTitle').innerText = `${cat.icon} ${cat.name}（共 ${cat.items.length} 個）`;
            
            const detailGrid = document.getElementById('vocabDetailGrid');
            detailGrid.innerHTML = '';

            cat.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="vocab-jp">${item.jp}</div>
                    <div class="vocab-zh">${item.zh}</div>
                    <div class="vocab-romaji">${item.romaji}</div>
                `;
                // 點擊卡片時，開啟彈跳視窗展示例句並朗讀單字
                card.onclick = () => {
                    speak(item.read);
                    showWordModal(item);
                };
                detailGrid.appendChild(card);
            });
        }

        // 顯示單字例句彈跳視窗
        let currentModalItem = {};
        function showWordModal(item) {
            currentModalItem = item;
            document.getElementById('modalJp').innerText = item.jp;
            document.getElementById('modalRomaji').innerText = item.romaji;
            document.getElementById('modalZh').innerText = item.zh;
            document.getElementById('modalStJp').innerText = `🔊 例句：${item.stJp}`;
            document.getElementById('modalStZh').innerText = item.stZh;
            document.getElementById('wordModal').style.display = 'flex';
        }

        // 關閉彈跳視窗
        function closeModal() {
            document.getElementById('wordModal').style.display = 'none';
        }

        // 朗讀彈跳視窗中的例句
        function speakModalSentence() {
            if (currentModalItem.stRead) {
                speak(currentModalItem.stRead);
            }
        }

        // 點擊視窗外部也可以關閉
        window.onclick = function(event) {
            const modal = document.getElementById('wordModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // 從分類詳細頁返回主選單
        function backToMenu() {
            document.getElementById('category-detail-section').classList.remove('active');
            document.getElementById('main-menu-section').classList.add('active');
        }

        // 切換主頁籤（選單 vs 隨機測驗）
        function switchMainTab(tabName) {
            document.querySelectorAll('.container > .section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('tabMenuBtn').classList.remove('active');
            document.getElementById('tabQuizBtn').classList.remove('active');

            if (tabName === 'menu') {
                document.getElementById('main-menu-section').classList.add('active');
                document.getElementById('tabMenuBtn').classList.add('active');
            } else {
                document.getElementById('quiz-section').classList.add('active');
                document.getElementById('tabQuizBtn').classList.add('active');
                nextQuizQuestion();
            }
        }

        // 測驗變數
        let currentScore = 0;
        let currentItem = {};
        let quizMode = 1;

        function nextQuizQuestion() {
            document.getElementById('feedback').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';

            currentItem = allVocab[Math.floor(Math.random() * allVocab.length)];
            quizMode = Math.random() < 0.5 ? 1 : 2;

            let questionText = "";
            let promptText = "";
            let correctAns = "";
            let wrongPool = [];

            if (quizMode === 1) {
                promptText = "請問這個 JLPT N5 單字的意思是？";
                questionText = `${currentItem.jp} <span style="font-size:18px; color:#666;">(${currentItem.romaji})</span>`;
                speak(currentItem.read);
                correctAns = currentItem.zh;
                wrongPool = allVocab.map(i => i.zh);
            } else {
                promptText = "請問這個中文意思對應的 N5 日文單字是？";
                questionText = currentItem.zh;
                correctAns = currentItem.jp;
                wrongPool = allVocab.map(i => i.jp);
            }

            document.getElementById('quizPrompt').innerText = promptText;
            document.getElementById('quizQuestion').innerHTML = questionText;

            let options = [correctAns];
            while (options.length < 4) {
                const randomWrong = wrongPool[Math.floor(Math.random() * wrongPool.length)];
                if (!options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn, correctAns);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption, btnElement, correctAns) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const feedback = document.getElementById('feedback');
            if (selectedOption === correctAns) {
                feedback.style.color = 'green';
                feedback.innerText = '⭕ 答對了！太棒了！';
                currentScore += 10;
                document.getElementById('score').innerText = currentScore;
                btnElement.style.background = '#d4edda';
            } else {
                feedback.style.color = 'red';
                feedback.innerText = `❌ 答錯了！正確答案是：${correctAns}`;
                btnElement.style.background = '#f8d7da';
                allBtns.forEach(b => {
                    if (b.innerText === correctAns) {
                        b.style.background = '#d4edda';
                    }
                });
            }
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    </script>
</body>
</html>
