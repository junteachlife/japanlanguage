<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N5・N4 核心單字學習中心</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23fff%22/><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23e53935%22/><text x=%2250%22 y=%2266%22 text-anchor=%22middle%22 font-size=%2250%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22white%22>日</text></svg>">

<style>
:root{
    --primary:#3f51b5;
    --primary-dark:#283593;
    --n5:#2e7d32;
    --n4:#ef6c00;
    --bg:#f4f6fb;
    --card:#fff;
    --text:#263238;
    --muted:#687078;
    --border:#e1e5ee;
    --danger:#d32f2f;
    --warning:#f9a825;
    --success:#2e7d32;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Noto Sans TC","Noto Sans JP",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

.topbar{
    background:linear-gradient(135deg,#283593,#3f51b5,#5c6bc0);
    color:white;
    padding:28px 20px 32px;
}

.top-inner{
    max-width:1200px;
    margin:auto;
}

.home-link{
    color:white;
    text-decoration:none;
    font-weight:700;
    display:inline-block;
    margin-bottom:16px;
}

h1{
    margin:0 0 8px;
    font-size:32px;
}

.subtitle{
    margin:0;
    opacity:.92;
    line-height:1.7;
}

.wrapper{
    max-width:1200px;
    margin:24px auto;
    padding:0 16px 40px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:20px;
}

.stat-card{
    background:white;
    border-radius:14px;
    padding:18px;
    box-shadow:0 4px 16px rgba(0,0,0,.05);
}

.stat-label{
    color:var(--muted);
    font-size:13px;
}

.stat-number{
    font-size:27px;
    font-weight:800;
    margin-top:5px;
    color:var(--primary);
}

.progress-wrap{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:0 4px 16px rgba(0,0,0,.05);
}

.progress-row{
    display:grid;
    grid-template-columns:80px 1fr 80px;
    gap:12px;
    align-items:center;
    margin:10px 0;
}

.progress-bg{
    height:12px;
    background:#e9ecf4;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#3f51b5,#7986cb);
    transition:.3s;
}

.nav-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.tab-btn{
    border:0;
    background:#e4e7ef;
    padding:11px 18px;
    border-radius:25px;
    font-size:15px;
    cursor:pointer;
    font-weight:700;
}

.tab-btn.active{
    background:var(--primary);
    color:white;
}

.panel{
    background:white;
    border-radius:15px;
    padding:22px;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.section{display:none}
.section.active{display:block}

.filters{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:10px;
    margin-bottom:18px;
}

.filters input,
.filters select{
    width:100%;
    border:1px solid #ccd2df;
    border-radius:9px;
    padding:11px;
    font-size:15px;
    background:white;
}

.category-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.category-card{
    border:1px solid #dce1ed;
    background:linear-gradient(145deg,#fff,#f5f6fb);
    border-radius:13px;
    padding:20px 12px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.category-card:hover{
    transform:translateY(-4px);
    box-shadow:0 7px 18px rgba(63,81,181,.12);
}

.category-icon{font-size:34px}

.category-title{
    font-weight:800;
    margin-top:8px;
}

.category-count{
    font-size:13px;
    color:var(--muted);
    margin-top:5px;
}

.back-btn{
    border:0;
    background:#607d8b;
    color:white;
    padding:9px 15px;
    border-radius:7px;
    cursor:pointer;
    margin-bottom:15px;
}

.vocab-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.vocab-card{
    position:relative;
    border:2px solid #e0e4ee;
    border-radius:12px;
    padding:15px 10px;
    text-align:center;
    cursor:pointer;
    background:#fff;
    transition:.2s;
}

.vocab-card:hover{
    transform:translateY(-3px);
    border-color:#9fa8da;
    box-shadow:0 5px 15px rgba(0,0,0,.06);
}

.level-badge{
    position:absolute;
    right:7px;
    top:7px;
    font-size:11px;
    color:white;
    padding:3px 7px;
    border-radius:12px;
    font-weight:800;
}

.level-N5{background:var(--n5)}
.level-N4{background:var(--n4)}

.vocab-jp{
    font-size:20px;
    font-weight:800;
    color:#1a237e;
    margin-top:8px;
}

.vocab-read{
    font-size:14px;
    color:#555;
    margin-top:5px;
}

.vocab-zh{
    margin-top:6px;
    font-size:14px;
}

.vocab-romaji{
    margin-top:3px;
    color:#888;
    font-size:12px;
}

.status-dot{
    margin-top:8px;
    font-size:12px;
    color:#777;
}

.empty{
    text-align:center;
    padding:40px;
    color:#777;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1000;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.modal-content{
    background:white;
    width:100%;
    max-width:560px;
    max-height:92vh;
    overflow:auto;
    border-radius:16px;
    padding:28px;
    position:relative;
}

.close{
    position:absolute;
    right:17px;
    top:12px;
    font-size:27px;
    cursor:pointer;
    color:#777;
}

.modal-word{
    font-size:32px;
    font-weight:900;
    color:var(--primary-dark);
}

.modal-read{
    font-size:18px;
    margin-top:5px;
}

.modal-romaji{
    color:#888;
    margin-top:3px;
}

.modal-zh{
    color:#2e7d32;
    font-size:20px;
    font-weight:800;
    margin-top:10px;
}

.audio-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:16px;
}

.audio-btn{
    border:0;
    background:#3f51b5;
    color:white;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.sentence-box{
    background:#f1f8e9;
    border-left:5px solid #7cb342;
    padding:15px;
    border-radius:9px;
    margin-top:18px;
}

.sentence-jp{
    font-size:18px;
    font-weight:800;
    line-height:1.7;
}

.sentence-read{
    margin-top:6px;
    color:#555;
    line-height:1.6;
}

.sentence-zh{
    margin-top:7px;
    color:#555;
}

.learning-status{
    margin-top:20px;
    border-top:1px solid #eee;
    padding-top:17px;
}

.status-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}

.status-btn{
    padding:10px 5px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
    cursor:pointer;
}

.status-btn.selected{
    outline:3px solid #c5cae9;
    font-weight:800;
}

.word-navigation{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:10px;
    align-items:center;
    margin-top:20px;
    padding-top:17px;
    border-top:1px solid #eee;
}

.word-nav-btn{
    border:0;
    background:#eef0fb;
    color:var(--primary-dark);
    padding:11px 10px;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
    font-weight:800;
    transition:.2s;
}

.word-nav-btn:hover{
    background:#dfe3f7;
}

.word-nav-btn:active{
    transform:scale(.97);
}

.word-position{
    min-width:82px;
    text-align:center;
    color:#687078;
    font-size:13px;
    font-weight:700;
}

.quiz-settings{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:20px;
}

.quiz-settings select{
    padding:9px;
    border:1px solid #ccc;
    border-radius:7px;
}

.quiz-box{text-align:center}

.quiz-score{
    font-weight:800;
    color:#555;
    margin-bottom:12px;
}

.quiz-prompt{
    color:#666;
    margin-bottom:10px;
}

.quiz-question{
    font-size:32px;
    font-weight:900;
    color:var(--primary-dark);
    margin:18px 0;
    min-height:48px;
}

.quiz-read{
    color:#777;
    font-size:15px;
}

.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    max-width:800px;
    margin:20px auto 0;
}

.option{
    padding:15px;
    border:2px solid #ddd;
    background:white;
    border-radius:9px;
    font-size:17px;
    cursor:pointer;
}

.option:hover{
    border-color:#9fa8da;
    background:#f7f7fb;
}

.feedback{
    margin-top:17px;
    font-size:17px;
    font-weight:800;
    line-height:1.7;
}

.quiz-example{
    max-width:650px;
    margin:15px auto;
    padding:13px;
    background:#f7f8fb;
    border-radius:8px;
    display:none;
}

.next-btn{
    display:none;
    border:0;
    background:#43a047;
    color:white;
    padding:11px 25px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.review-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.toggle-btn{
    border:1px solid #aaa;
    background:white;
    padding:8px 13px;
    border-radius:7px;
    cursor:pointer;
}

@media(max-width:900px){
    .dashboard{grid-template-columns:repeat(2,1fr)}
    .category-grid{grid-template-columns:repeat(3,1fr)}
    .vocab-grid,.review-grid{grid-template-columns:repeat(3,1fr)}
    .filters{grid-template-columns:1fr 1fr}
}

@media(max-width:600px){
    .topbar{padding:22px 15px}
    h1{font-size:25px}
    .wrapper{padding:0 10px 30px}
    .dashboard{grid-template-columns:repeat(2,1fr)}
    .stat-number{font-size:22px}
    .panel{padding:14px}
    .category-grid{grid-template-columns:repeat(2,1fr)}
    .vocab-grid,.review-grid{grid-template-columns:repeat(2,1fr)}
    .filters{grid-template-columns:1fr}
    .options{grid-template-columns:1fr}
    .status-buttons{grid-template-columns:1fr}
    .modal-content{padding:24px 18px}
    .progress-row{grid-template-columns:55px 1fr 60px}

    .word-navigation{
        grid-template-columns:1fr auto 1fr;
        gap:6px;
    }

    .word-nav-btn{
        padding:11px 6px;
        font-size:13px;
    }

    .word-position{
        min-width:68px;
        font-size:12px;
    }
}
</style>

<script src="js/vocab-data.js"></script>
</head>

<body>

<header class="topbar">
<div class="top-inner">
<a class="home-link" href="index.html">⬅️ 返回學習首頁</a>
<h1>📘 JLPT N5・N4 核心單字學習中心</h1>
<p class="subtitle">
從 N5 基礎一路學到 N4。每個單字都有讀音、中文意思、專屬例句與日文發音，
並記錄自己的熟悉程度與錯題。
</p>
</div>
</header>

<main class="wrapper">

<div class="dashboard">

<div class="stat-card">
<div class="stat-label">📚 真實詞彙</div>
<div class="stat-number" id="totalWords">0</div>
</div>

<div class="stat-card">
<div class="stat-label">🌱 N5 詞彙</div>
<div class="stat-number" id="n5Words">0</div>
</div>

<div class="stat-card">
<div class="stat-label">🚀 N4 詞彙</div>
<div class="stat-number" id="n4Words">0</div>
</div>

<div class="stat-card">
<div class="stat-label">⭐ 已熟悉</div>
<div class="stat-number" id="masteredWords">0</div>
</div>

</div>

<div class="progress-wrap">
<strong>📊 我的學習進度</strong>

<div class="progress-row">
<span>N5</span>
<div class="progress-bg"><div id="n5Progress" class="progress-bar"></div></div>
<span id="n5ProgressText">0%</span>
</div>

<div class="progress-row">
<span>N4</span>
<div class="progress-bg"><div id="n4Progress" class="progress-bar"></div></div>
<span id="n4ProgressText">0%</span>
</div>
</div>

<div class="nav-tabs">
<button class="tab-btn active" data-tab="learn" onclick="switchTab('learn')">📚 單字學習</button>
<button class="tab-btn" data-tab="review" onclick="switchTab('review')">🧠 待複習</button>
<button class="tab-btn" data-tab="quiz" onclick="switchTab('quiz')">✍️ 單字測驗</button>
<button class="tab-btn" data-tab="wrong" onclick="switchTab('wrong')">⭐ 我的錯題</button>
</div>

<div class="panel">

<section id="learn-section" class="section active">

<div class="filters">

<input id="searchInput"
type="search"
placeholder="🔎 搜尋日文、假名、羅馬字或中文"
oninput="renderCategories()">

<select id="levelFilter" onchange="renderCategories()">
<option value="ALL">全部級別</option>
<option value="N5">N5</option>
<option value="N4">N4</option>
</select>

<select id="statusFilter" onchange="renderCategories()">
<option value="ALL">全部學習狀態</option>
<option value="new">未學習</option>
<option value="learning">學習中</option>
<option value="mastered">已熟悉</option>
</select>

<button class="toggle-btn" id="romajiToggle" onclick="toggleRomaji()">
羅馬字：顯示
</button>

</div>

<div id="categoryView">
<h3 id="categorySummary"></h3>
<div id="categoryGrid" class="category-grid"></div>
</div>

<div id="detailView" style="display:none;">
<button class="back-btn" onclick="backToCategories()">⬅️ 返回主題分類</button>
<h2 id="detailTitle"></h2>
<div id="vocabGrid" class="vocab-grid"></div>
</div>

</section>

<section id="review-section" class="section">
<h2>🧠 待複習單字</h2>
<p>這裡會集中顯示你標記為「不會」或「學習中」的單字。</p>
<div id="reviewGrid" class="review-grid"></div>
</section>

<section id="quiz-section" class="section">

<div class="quiz-settings">

<select id="quizLevel">
<option value="ALL">N5＋N4</option>
<option value="N5">只測 N5</option>
<option value="N4">只測 N4</option>
</select>

<select id="quizMode">
<option value="random">🎲 隨機題型</option>
<option value="jpZh">日文 → 中文</option>
<option value="zhJp">中文 → 日文</option>
<option value="reading">漢字 → 讀音</option>
<option value="listening">聽力 → 選單字</option>
</select>

<button class="audio-btn" onclick="startQuiz()">開始／重新測驗</button>

</div>

<div class="quiz-box">

<div class="quiz-score">
得分：<span id="score">0</span>
　｜　答對：<span id="correctCount">0</span>
　｜　答錯：<span id="wrongCount">0</span>
</div>

<div class="quiz-prompt" id="quizPrompt">請選擇級別與題型後開始。</div>
<div class="quiz-question" id="quizQuestion">🎌</div>
<div class="quiz-read" id="quizRead"></div>

<div id="listenButtonArea"></div>
<div id="optionsGrid" class="options"></div>
<div id="feedback" class="feedback"></div>
<div id="quizExample" class="quiz-example"></div>

<button id="nextBtn" class="next-btn" onclick="nextQuestion()">下一題 ➜</button>

</div>
</section>

<section id="wrong-section" class="section">
<h2>⭐ 我的錯題</h2>
<p>答錯過的單字會自動收錄在這裡，答對後仍保留，方便反覆複習。</p>

<button class="back-btn" onclick="clearWrongWords()">清除全部錯題紀錄</button>

<div id="wrongGrid" class="review-grid"></div>
</section>

</div>
</main>

<div id="wordModal" class="modal">

<div class="modal-content">

<span class="close" onclick="closeModal()">&times;</span>

<div>
<span id="modalLevel"
class="level-badge"
style="position:static;display:inline-block;"></span>
</div>

<div id="modalWord" class="modal-word"></div>
<div id="modalRead" class="modal-read"></div>
<div id="modalRomaji" class="modal-romaji"></div>
<div id="modalZh" class="modal-zh"></div>

<div class="audio-row">
<button class="audio-btn" onclick="speakCurrentWord(.9)">🔊 單字</button>
<button class="audio-btn" onclick="speakCurrentWord(.7)">🐢 慢速</button>
</div>

<div class="sentence-box">

<div id="modalSentence" class="sentence-jp"></div>
<div id="modalSentenceRead" class="sentence-read"></div>
<div id="modalSentenceZh" class="sentence-zh"></div>

<div class="audio-row">
<button class="audio-btn" onclick="speakCurrentSentence(.9)">🔊 例句</button>
<button class="audio-btn" onclick="speakCurrentSentence(.7)">🐢 慢速例句</button>
</div>

</div>

<div class="learning-status">

<strong>我的熟悉程度</strong>

<div class="status-buttons">
<button id="status-new" class="status-btn" onclick="setLearningStatus('new')">😵 不會</button>
<button id="status-learning" class="status-btn" onclick="setLearningStatus('learning')">🤔 有印象</button>
<button id="status-mastered" class="status-btn" onclick="setLearningStatus('mastered')">😊 熟悉</button>
</div>

</div>

<div class="word-navigation">

<button class="word-nav-btn" onclick="previousModalWord()">
⬅️ 上一個
</button>

<div id="modalPosition" class="word-position">
1 / 1
</div>

<button class="word-nav-btn" onclick="nextModalWord()">
下一個 ➡️
</button>

</div>

</div>
</div>

<script>

const allVocab=[];

vocabCategories.forEach(category=>{
    category.items.forEach((item,index)=>{
        allVocab.push({
            ...item,
            categoryId:category.id,
            categoryName:category.name,
            categoryIcon:category.icon,
            uid:item.id || `${category.id}_${index}`
        });
    });
});

let showRomaji=
    localStorage.getItem("jlptShowRomaji")!=="false";

let currentModalItem=null;
let currentModalList=[];
let currentModalIndex=-1;

let score=0;
let correctCount=0;
let wrongCount=0;
let currentQuizItem=null;
let currentCorrectAnswer="";
let currentQuizMode="";
let lastQuizUid=null;

function cancelSpeech(){
    if(
        "speechSynthesis" in window &&
        window.speechSynthesis
    ){
        window.speechSynthesis.cancel();
    }
}

function getProgress(){
    try{
        return JSON.parse(
            localStorage.getItem("jlptVocabProgress") || "{}"
        );
    }catch{
        return {};
    }
}

function saveProgress(data){
    localStorage.setItem(
        "jlptVocabProgress",
        JSON.stringify(data)
    );
}

function getWrongWords(){
    try{
        return JSON.parse(
            localStorage.getItem("jlptWrongWords") || "[]"
        );
    }catch{
        return [];
    }
}

function saveWrongWords(arr){
    localStorage.setItem(
        "jlptWrongWords",
        JSON.stringify([...new Set(arr)])
    );
}


/* ===== JLPT 全站共用學習摘要（不取代原有紀錄） ===== */
const JLPT_SHARED_PROGRESS_KEY="jlptLearningCenterProgressV1";

function readSharedProgress(){
    try{
        return JSON.parse(localStorage.getItem(JLPT_SHARED_PROGRESS_KEY)||"{}");
    }catch{
        return {};
    }
}

function syncVocabToSharedProgress(){
    const progress=getProgress();
    const wrong=getWrongWords();
    const n5=allVocab.filter(x=>x.level==="N5");
    const n4=allVocab.filter(x=>x.level==="N4");
    const masteredN5=n5.filter(x=>progress[x.uid]==="mastered").length;
    const masteredN4=n4.filter(x=>progress[x.uid]==="mastered").length;
    const learningCount=allVocab.filter(x=>progress[x.uid]==="learning"||progress[x.uid]==="new").length;

    const shared=readSharedProgress();
    shared.vocab={
        updatedAt:new Date().toISOString(),
        total:allVocab.length,
        n5Total:n5.length,
        n4Total:n4.length,
        mastered:masteredN5+masteredN4,
        masteredN5,
        masteredN4,
        masteredN5Pct:n5.length?Math.round(masteredN5/n5.length*100):0,
        masteredN4Pct:n4.length?Math.round(masteredN4/n4.length*100):0,
        learningCount,
        wrongCount:wrong.length,
        wrongIds:[...wrong]
    };
    localStorage.setItem(JLPT_SHARED_PROGRESS_KEY,JSON.stringify(shared));
}

function statusText(status){
    if(status==="mastered") return "😊 已熟悉";
    if(status==="learning") return "🤔 學習中";
    if(status==="new") return "😵 待複習";
    return "尚未學習";
}

function normalize(text){
    return String(text || "").toLowerCase().trim();
}

function speak(text,rate=.9){

    if(!("speechSynthesis" in window)){
        alert("目前瀏覽器不支援語音朗讀功能。");
        return;
    }

    cancelSpeech();

    const u=new SpeechSynthesisUtterance(text);

    u.lang="ja-JP";
    u.rate=rate;

    const voices=
        window.speechSynthesis.getVoices();

    const jaVoice=voices.find(v=>
        v.lang &&
        v.lang.toLowerCase().startsWith("ja")
    );

    if(jaVoice){
        u.voice=jaVoice;
    }

    window.speechSynthesis.speak(u);
}

function speakCurrentWord(rate){
    if(currentModalItem){
        speak(
            currentModalItem.read ||
            currentModalItem.jp,
            rate
        );
    }
}

function speakCurrentSentence(rate){
    if(currentModalItem){
        speak(
            currentModalItem.stRead ||
            currentModalItem.stJp,
            rate
        );
    }
}

function updateDashboard(){

    const n5=allVocab.filter(x=>x.level==="N5");
    const n4=allVocab.filter(x=>x.level==="N4");

    const progress=getProgress();

    const mastered=
        allVocab.filter(
            x=>progress[x.uid]==="mastered"
        );

    document.getElementById("totalWords").textContent=
        allVocab.length;

    document.getElementById("n5Words").textContent=
        n5.length;

    document.getElementById("n4Words").textContent=
        n4.length;

    document.getElementById("masteredWords").textContent=
        mastered.length;

    const n5Mastered=
        n5.filter(
            x=>progress[x.uid]==="mastered"
        ).length;

    const n4Mastered=
        n4.filter(
            x=>progress[x.uid]==="mastered"
        ).length;

    const n5Pct=
        n5.length
        ? Math.round(n5Mastered/n5.length*100)
        : 0;

    const n4Pct=
        n4.length
        ? Math.round(n4Mastered/n4.length*100)
        : 0;

    document.getElementById("n5Progress").style.width=
        n5Pct+"%";

    document.getElementById("n4Progress").style.width=
        n4Pct+"%";

    document.getElementById("n5ProgressText").textContent=
        n5Pct+"%";

    document.getElementById("n4ProgressText").textContent=
        n4Pct+"%";
}

function switchTab(name){

    document.querySelectorAll(".section")
        .forEach(
            x=>x.classList.remove("active")
        );

    document.querySelectorAll(".tab-btn")
        .forEach(
            x=>x.classList.remove("active")
        );

    document.getElementById(name+"-section")
        .classList.add("active");

    const tab=
        document.querySelector(
            `[data-tab="${name}"]`
        );

    if(tab){
        tab.classList.add("active");
    }

    if(name==="review"){
        renderReview();
    }

    if(name==="wrong"){
        renderWrongWords();
    }
}

function getFilteredItems(items){

    const q=
        normalize(
            document.getElementById("searchInput").value
        );

    const level=
        document.getElementById("levelFilter").value;

    const status=
        document.getElementById("statusFilter").value;

    const progress=getProgress();

    return items.filter(item=>{

        const searchable=
            normalize([
                item.jp,
                item.read,
                item.romaji,
                item.zh,
                item.stJp,
                item.stZh
            ].join(" "));

        const matchSearch=
            !q ||
            searchable.includes(q);

        const matchLevel=
            level==="ALL" ||
            item.level===level;

        let matchStatus=true;

        if(status!=="ALL"){

            if(status==="new"){

                matchStatus=
                    !progress[item.uid] ||
                    progress[item.uid]==="new";

            }else{

                matchStatus=
                    progress[item.uid]===status;

            }
        }

        return(
            matchSearch &&
            matchLevel &&
            matchStatus
        );
    });
}

function renderCategories(){

    document.getElementById("detailView").style.display=
        "none";

    document.getElementById("categoryView").style.display=
        "block";

    const grid=
        document.getElementById("categoryGrid");

    grid.innerHTML="";

    let visibleTotal=0;

    vocabCategories.forEach(category=>{

        const categoryItems=
            allVocab.filter(
                x=>x.categoryId===category.id
            );

        const filtered=
            getFilteredItems(categoryItems);

        if(!filtered.length){
            return;
        }

        visibleTotal+=filtered.length;

        const n5=
            filtered.filter(
                x=>x.level==="N5"
            ).length;

        const n4=
            filtered.filter(
                x=>x.level==="N4"
            ).length;

        const card=
            document.createElement("div");

        card.className="category-card";

        card.innerHTML=`
            <div class="category-icon">
                ${category.icon}
            </div>

            <div class="category-title">
                ${category.name}
            </div>

            <div class="category-count">
                ${filtered.length} 字
                ${n5 ? `・N5 ${n5}` : ""}
                ${n4 ? `・N4 ${n4}` : ""}
            </div>
        `;

        card.onclick=
            ()=>openCategory(category.id);

        grid.appendChild(card);
    });

    document.getElementById("categorySummary").textContent=
        `📚 目前條件共 ${visibleTotal} 個真正詞彙`;

    if(!visibleTotal){
        grid.innerHTML=
            `<div class="empty">
                找不到符合條件的單字。
            </div>`;
    }
}

function openCategory(categoryId){

    const category=
        vocabCategories.find(
            c=>c.id===categoryId
        );

    if(!category){
        return;
    }

    const items=
        getFilteredItems(
            allVocab.filter(
                x=>x.categoryId===categoryId
            )
        );

    document.getElementById("categoryView").style.display=
        "none";

    document.getElementById("detailView").style.display=
        "block";

    document.getElementById("detailTitle").textContent=
        `${category.icon} ${category.name}（${items.length} 字）`;

    renderWordCards(
        document.getElementById("vocabGrid"),
        items
    );
}

function backToCategories(){
    renderCategories();
}

function renderWordCards(container,items){

    container.innerHTML="";

    if(!items.length){
        container.innerHTML=
            `<div class="empty">
                目前沒有符合條件的單字。
            </div>`;
        return;
    }

    const progress=getProgress();

    items.forEach(item=>{

        const card=
            document.createElement("div");

        card.className="vocab-card";

        card.innerHTML=`
            <span class="level-badge level-${item.level}">
                ${item.level}
            </span>

            <div class="vocab-jp">
                ${item.jp}
            </div>

            <div class="vocab-read">
                ${item.read}
            </div>

            <div class="vocab-romaji"
                 style="${showRomaji ? "" : "display:none"}">
                ${item.romaji || ""}
            </div>

            <div class="vocab-zh">
                ${item.zh}
            </div>

            <div class="status-dot">
                ${statusText(progress[item.uid])}
            </div>
        `;

        card.onclick=
            ()=>showModal(item,items);

        container.appendChild(card);
    });
}

function showModal(item,list=null){

    if(
        Array.isArray(list) &&
        list.length
    ){
        currentModalList=[...list];
    }else{
        currentModalList=[item];
    }

    currentModalIndex=
        currentModalList.findIndex(
            x=>x.uid===item.uid
        );

    if(currentModalIndex<0){
        currentModalList=[item];
        currentModalIndex=0;
    }

    currentModalItem=item;

    renderModalItem();

    document.getElementById("wordModal").style.display=
        "flex";
}

function renderModalItem(){

    if(!currentModalItem){
        return;
    }

    const item=currentModalItem;

    document.getElementById("modalLevel").textContent=
        item.level;

    document.getElementById("modalLevel").className=
        `level-badge level-${item.level}`;

    document.getElementById("modalWord").textContent=
        item.jp;

    document.getElementById("modalRead").textContent=
        item.read;

    document.getElementById("modalRomaji").textContent=
        showRomaji
        ? (item.romaji || "")
        : "";

    document.getElementById("modalZh").textContent=
        item.zh;

    document.getElementById("modalSentence").textContent=
        item.stJp;

    document.getElementById("modalSentenceRead").textContent=
        item.stRead || "";

    document.getElementById("modalSentenceZh").textContent=
        item.stZh;

    updateModalStatus();
    updateModalPosition();
}

function updateModalPosition(){

    const position=
        document.getElementById("modalPosition");

    if(
        !currentModalList.length ||
        currentModalIndex<0
    ){
        position.textContent="1 / 1";
        return;
    }

    position.textContent=
        `${currentModalIndex+1} / ${currentModalList.length}`;
}

function scrollModalToTop(){

    const modalContent=
        document.querySelector(
            "#wordModal .modal-content"
        );

    if(modalContent){
        modalContent.scrollTo({
            top:0,
            behavior:"smooth"
        });
    }
}

function previousModalWord(){

    if(!currentModalList.length){
        return;
    }

    cancelSpeech();

    currentModalIndex--;

    if(currentModalIndex<0){
        currentModalIndex=
            currentModalList.length-1;
    }

    currentModalItem=
        currentModalList[currentModalIndex];

    renderModalItem();
    scrollModalToTop();
}

function nextModalWord(){

    if(!currentModalList.length){
        return;
    }

    cancelSpeech();

    currentModalIndex++;

    if(
        currentModalIndex>=
        currentModalList.length
    ){
        currentModalIndex=0;
    }

    currentModalItem=
        currentModalList[currentModalIndex];

    renderModalItem();
    scrollModalToTop();
}

function closeModal(){

    cancelSpeech();

    document.getElementById("wordModal").style.display=
        "none";
}

function updateModalStatus(){

    document.querySelectorAll(".status-btn")
        .forEach(
            x=>x.classList.remove("selected")
        );

    if(!currentModalItem){
        return;
    }

    const status=
        getProgress()[currentModalItem.uid];

    if(status){

        const btn=
            document.getElementById(
                "status-"+status
            );

        if(btn){
            btn.classList.add("selected");
        }
    }
}

function setLearningStatus(status){

    if(!currentModalItem){
        return;
    }

    const progress=getProgress();

    progress[currentModalItem.uid]=status;

    saveProgress(progress);
    syncVocabToSharedProgress();

    updateModalStatus();
    updateDashboard();
    refreshVisibleWordLists();
}

function refreshVisibleWordLists(){

    const detailView=
        document.getElementById("detailView");

    const learnSection=
        document.getElementById("learn-section");

    if(
        learnSection.classList.contains("active")
    ){

        if(
            detailView.style.display==="none"
        ){

            renderCategories();

        }else{

            const currentCategory=
                currentModalItem
                ? currentModalItem.categoryId
                : null;

            if(currentCategory){

                const category=
                    vocabCategories.find(
                        c=>c.id===currentCategory
                    );

                if(category){

                    const items=
                        getFilteredItems(
                            allVocab.filter(
                                x=>x.categoryId===currentCategory
                            )
                        );

                    document.getElementById("detailTitle").textContent=
                        `${category.icon} ${category.name}（${items.length} 字）`;

                    renderWordCards(
                        document.getElementById("vocabGrid"),
                        items
                    );
                }
            }
        }
    }

    if(
        document.getElementById("review-section")
            .classList.contains("active")
    ){
        renderReview();
    }

    if(
        document.getElementById("wrong-section")
            .classList.contains("active")
    ){
        renderWrongWords();
    }
}

function toggleRomaji(){

    showRomaji=!showRomaji;

    localStorage.setItem(
        "jlptShowRomaji",
        String(showRomaji)
    );

    document.getElementById("romajiToggle").textContent=
        `羅馬字：${showRomaji ? "顯示" : "隱藏"}`;

    renderCategories();

    if(currentModalItem){

        document.getElementById("modalRomaji").textContent=
            showRomaji
            ? (currentModalItem.romaji || "")
            : "";
    }
}

function renderReview(){

    const progress=getProgress();

    const items=
        allVocab.filter(
            item=>
                progress[item.uid]==="new" ||
                progress[item.uid]==="learning"
        );

    renderWordCards(
        document.getElementById("reviewGrid"),
        items
    );
}

function renderWrongWords(){

    const ids=getWrongWords();

    const items=
        ids
        .map(
            id=>allVocab.find(
                x=>x.uid===id
            )
        )
        .filter(Boolean);

    renderWordCards(
        document.getElementById("wrongGrid"),
        items
    );
}

function clearWrongWords(){

    if(
        !confirm(
            "確定要清除全部錯題紀錄嗎？"
        )
    ){
        return;
    }

    saveWrongWords([]);
    syncVocabToSharedProgress();
    renderWrongWords();
}

function shuffle(array){

    const a=[...array];

    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );

        [a[i],a[j]]=
            [a[j],a[i]];
    }

    return a;
}

function startQuiz(){

    score=0;
    correctCount=0;
    wrongCount=0;
    lastQuizUid=null;

    updateQuizScore();
    nextQuestion();
}

function updateQuizScore(){

    document.getElementById("score").textContent=
        score;

    document.getElementById("correctCount").textContent=
        correctCount;

    document.getElementById("wrongCount").textContent=
        wrongCount;
}

function nextQuestion(){

    document.getElementById("feedback").innerHTML="";

    document.getElementById("quizExample").style.display=
        "none";

    document.getElementById("quizExample").innerHTML="";

    document.getElementById("nextBtn").style.display=
        "none";

    document.getElementById("listenButtonArea").innerHTML="";

    const level=
        document.getElementById("quizLevel").value;

    let pool=
        allVocab.filter(
            x=>
                level==="ALL" ||
                x.level===level
        );

    if(pool.length<4){

        document.getElementById("quizPrompt").textContent=
            "目前這個級別的單字不足 4 個，無法產生測驗。";

        return;
    }

    let candidatePool=
        pool.filter(
            x=>x.uid!==lastQuizUid
        );

    if(!candidatePool.length){
        candidatePool=pool;
    }

    currentQuizItem=
        candidatePool[
            Math.floor(
                Math.random()*candidatePool.length
            )
        ];

    lastQuizUid=currentQuizItem.uid;

    let mode=
        document.getElementById("quizMode").value;

    if(mode==="random"){

        const modes=[
            "jpZh",
            "zhJp",
            "reading",
            "listening"
        ];

        mode=
            modes[
                Math.floor(
                    Math.random()*modes.length
                )
            ];
    }

    currentQuizMode=mode;

    let prompt="";
    let question="";
    let read="";
    let correct="";
    let wrongPool=[];

    if(mode==="jpZh"){

        prompt=
            "這個日文單字的中文意思是？";

        question=
            currentQuizItem.jp;

        read=
            currentQuizItem.read;

        correct=
            currentQuizItem.zh;

        wrongPool=
            pool.map(x=>x.zh);
    }

    if(mode==="zhJp"){

        prompt=
            "這個中文意思對應哪一個日文單字？";

        question=
            currentQuizItem.zh;

        correct=
            currentQuizItem.jp;

        wrongPool=
            pool.map(x=>x.jp);
    }

    if(mode==="reading"){

        prompt=
            "請選出這個單字的正確讀音。";

        question=
            currentQuizItem.jp;

        correct=
            currentQuizItem.read;

        wrongPool=
            pool.map(x=>x.read);
    }

    if(mode==="listening"){

        prompt=
            "🔊 聽發音後，選出正確的日文單字。";

        question=
            "🎧 聽力題";

        correct=
            currentQuizItem.jp;

        wrongPool=
            pool.map(x=>x.jp);

        document.getElementById("listenButtonArea").innerHTML=`
            <button class="audio-btn"
                    onclick="playQuizAudio(.9)">
                🔊 再聽一次
            </button>

            <button class="audio-btn"
                    onclick="playQuizAudio(.7)">
                🐢 慢速
            </button>
        `;

        setTimeout(
            ()=>playQuizAudio(.9),
            250
        );
    }

    currentCorrectAnswer=correct;

    document.getElementById("quizPrompt").textContent=
        prompt;

    document.getElementById("quizQuestion").textContent=
        question;

    document.getElementById("quizRead").textContent=
        read;

    const uniqueWrong=[
        ...new Set(
            wrongPool.filter(
                x=>x!==correct
            )
        )
    ];

    const options=[
        correct,
        ...shuffle(uniqueWrong).slice(0,3)
    ];

    renderOptions(
        shuffle(options)
    );
}

function playQuizAudio(rate=.9){

    if(currentQuizItem){

        speak(
            currentQuizItem.read ||
            currentQuizItem.jp,
            rate
        );
    }
}

function renderOptions(options){

    const grid=
        document.getElementById("optionsGrid");

    grid.innerHTML="";

    options.forEach(option=>{

        const btn=
            document.createElement("button");

        btn.className="option";
        btn.textContent=option;

        btn.onclick=
            ()=>checkAnswer(
                option,
                btn
            );

        grid.appendChild(btn);
    });
}

function checkAnswer(selected,button){

    const buttons=
        document.querySelectorAll(".option");

    buttons.forEach(
        b=>b.disabled=true
    );

    const feedback=
        document.getElementById("feedback");

    if(
        selected===
        currentCorrectAnswer
    ){

        score+=10;
        correctCount++;

        button.style.background=
            "#dcedc8";

        button.style.borderColor=
            "#7cb342";

        feedback.style.color=
            "#2e7d32";

        feedback.innerHTML=
            "⭕ 答對了！";

    }else{

        wrongCount++;

        button.style.background=
            "#ffcdd2";

        button.style.borderColor=
            "#e57373";

        buttons.forEach(b=>{

            if(
                b.textContent===
                currentCorrectAnswer
            ){

                b.style.background=
                    "#dcedc8";

                b.style.borderColor=
                    "#7cb342";
            }
        });

        feedback.style.color=
            "#c62828";

        feedback.innerHTML=
            `❌ 答錯了。正確答案：${currentCorrectAnswer}`;

        const wrong=getWrongWords();

        if(
            !wrong.includes(
                currentQuizItem.uid
            )
        ){

            wrong.push(
                currentQuizItem.uid
            );

            saveWrongWords(wrong);
            syncVocabToSharedProgress();
        }
    }

    updateQuizScore();

    const example=
        document.getElementById("quizExample");

    example.innerHTML=`
        <strong>
            ${currentQuizItem.jp}
            （${currentQuizItem.read}）
        </strong>

        <br>

        ${currentQuizItem.zh}

        <hr style="border:0;border-top:1px solid #ddd;">

        ${currentQuizItem.stJp}

        <br>

        <span style="color:#777;">
            ${currentQuizItem.stRead || ""}
        </span>

        <br>

        ${currentQuizItem.stZh}

        <br><br>

        <button class="audio-btn"
                onclick="speakQuizExample()">
            🔊 聽例句
        </button>
    `;

    example.style.display=
        "block";

    document.getElementById("nextBtn").style.display=
        "inline-block";
}

function speakQuizExample(){

    if(currentQuizItem){

        speak(
            currentQuizItem.stRead ||
            currentQuizItem.stJp,
            .9
        );
    }
}

window.addEventListener(
    "click",
    event=>{

        if(
            event.target===
            document.getElementById("wordModal")
        ){
            closeModal();
        }
    }
);

document.addEventListener(
    "keydown",
    event=>{

        const modal=
            document.getElementById("wordModal");

        const modalOpen=
            modal.style.display==="flex";

        if(event.key==="Escape"){
            closeModal();
            return;
        }

        if(modalOpen){

            if(event.key==="ArrowLeft"){
                previousModalWord();
            }

            if(event.key==="ArrowRight"){
                nextModalWord();
            }
        }
    }
);


function applyIncomingStudyRoute(){
    const hash=location.hash.replace("#","").toLowerCase();
    if(hash==="wrong" || hash==="vocab-wrong"){
        switchTab("wrong");
    }else if(hash==="review" || hash==="vocab-review"){
        switchTab("review");
    }else if(hash==="quiz" || hash==="vocab-quiz"){
        switchTab("quiz");
    }
}

function initialize(){

    document.getElementById("romajiToggle").textContent=
        `羅馬字：${showRomaji ? "顯示" : "隱藏"}`;

    updateDashboard();
    renderCategories();
    syncVocabToSharedProgress();
}

initialize();
applyIncomingStudyRoute();
window.addEventListener("hashchange",applyIncomingStudyRoute);

</script>
