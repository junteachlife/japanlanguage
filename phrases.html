<header class="hero"><div class="hero-inner"><a class="back" href="index.html">⬅️ 返回學習首頁</a><h1>🗣️ 第四階段：JLPT N5・N4 實用片語 PRO 完整課程</h1><p>不是只背一句話，而是學會「什麼時候說、句子怎麼拆、還能怎麼替換」。收錄日本旅遊與日常生活高頻情境，搭配發音、老師講解、熟悉度與實戰測驗。</p></div></header>
<main class="wrap">
<div class="dashboard"><div class="stat"><small>📖 片語總數</small><div class="num" id="total">0</div></div><div class="stat"><small>🗂️ 情境分類</small><div class="num" id="catCount">0</div></div><div class="stat"><small>😊 已熟悉</small><div class="num" id="mastered">0</div></div><div class="stat"><small>⭐ 錯題</small><div class="num" id="wrongCount">0</div></div></div>

<div class="panel">
<section id="learn-section" class="section active">

<div id="categoryView"><h3 id="summary"></h3><div id="categoryGrid" class="category-grid"></div></div>

</section>
<section id="quiz-section" class="section">

<h2>🗣️ 片語 PRO 商用課程級情境訓練中心</h2>
<p>從中文選日文、日文選中文、聽力理解一路做到情境判斷。測驗採有限題數，並加入弱點與錯題再測。</p>
<div class="final-grid">

<label>情境<select id="quizCat"><option value="ALL">全部情境</option></select></label>

</div>
<div class="final-actions"><button class="start-btn" onclick="startQuiz('normal')">▶️ 開始測驗</button><button class="weak-btn" onclick="startQuiz('weak')">🎯 弱點特訓</button><button class="wrong-retry" onclick="startQuiz('wrong')">⭐ 錯題再測</button></div>
</div>

</section>

</div></main>

const phraseCategories=rawCategories.map(([id,name,en,items])=>({id,name,en,items:items.map((x,i)=>({id:`${id}-${String(i+1).padStart(2,"0")}`,categoryId:id,category:name,jp:x[0],read:x[1],romaji:x[2],zh:x[3],tip:x[4],explain:x[5],variation:x[6],variationZh:x[7]}))}));
const allPhrases=phraseCategories.flatMap(c=>c.items);
const $=id=>document.getElementById(id);
function getProgress(){try{return JSON.parse(localStorage.getItem("jlptPhraseProgress")||"{}")}catch{return {}}}
function saveProgress(x){localStorage.setItem("jlptPhraseProgress",JSON.stringify(x))}
function getWrong(){try{return JSON.parse(localStorage.getItem("jlptPhraseWrong")||"[]")}catch{return []}}
function saveWrong(x){localStorage.setItem("jlptPhraseWrong",JSON.stringify([...new Set(x)]))}
function getVoice(){return speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("ja"))}
function normalizeTtsText(text){
  if(!text)return "";
  const exactReadings={
    "張の名前で予約しています。":"チャンの名前で予約しています。",
    "張の名前で予約しています":"チャンの名前で予約しています"
  };
  if(exactReadings[text])return exactReadings[text];
  return text;
}
function speak(text,rate=.9){
  if(!("speechSynthesis" in window))return alert("目前瀏覽器不支援語音朗讀。");
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(normalizeTtsText(text));
  u.lang="ja-JP";
  u.rate=rate;
  const v=getVoice();
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function updateDashboard(){const p=getProgress();$("total").textContent=allPhrases.length;$("catCount").textContent=phraseCategories.length;$("mastered").textContent=allPhrases.filter(x=>p[x.id]==="mastered").length;$("wrongCount").textContent=getWrong().length}
function filtered(items=allPhrases){const q=$("search").value.trim().toLowerCase(),c=$("catFilter").value,s=$("statusFilter").value,p=getProgress();return items.filter(x=>{const text=[x.jp,x.read,x.romaji,x.zh,x.tip,x.explain,x.variation,x.category].join(" ").toLowerCase();return(!q||text.includes(q))&&(c==="ALL"||x.categoryId===c)&&(s==="ALL"||(s==="new"?!p[x.id]:p[x.id]===s))})}
function renderCategories(){$("categoryView").style.display="block";$("detailView").style.display="none";const list=filtered();$("summary").textContent=`📚 目前條件共有 ${list.length} 個實用片語`;const grid=$("categoryGrid");grid.innerHTML="";phraseCategories.forEach(c=>{const items=list.filter(x=>x.categoryId===c.id);if(!items.length)return;const d=document.createElement("div");d.className="cat";d.innerHTML=`<div class="cat-icon">${c.name.split(" ")[0]}</div><div class="cat-title">${c.name.replace(/^\S+\s/,"")}</div><div class="cat-count">${items.length} 個片語</div>`;d.onclick=()=>openCategory(c.id);grid.appendChild(d)});if(!list.length)grid.innerHTML='<div class="empty">找不到符合條件的片語。</div>'}
function openCategory(id){const c=phraseCategories.find(x=>x.id===id);const items=filtered(c.items);$("categoryView").style.display="none";$("detailView").style.display="block";$("detailTitle").textContent=`${c.name}（${items.length}）`;$("phraseContainer").innerHTML="";const p=getProgress();items.forEach(x=>{const d=document.createElement("div");d.className="phrase-card";d.innerHTML=`<div class="phrase-jp">${x.jp}</div><div class="read">${x.read} ｜ ${x.romaji}</div><div class="zh">🇹🇼 ${x.zh}</div><div class="audio-row"><button class="audio-btn main-audio">🔊 主句正常</button><button class="audio-btn slow main-audio">🐢 主句慢速</button></div><div class="teacher">👨‍🏫 <b>老師提醒：</b>${x.tip}</div><div class="explain"><b>🔍 句子拆解／用法：</b><br>${x.explain}</div><div class="variation"><b>🔄 替換練習：</b><br><b>${x.variation}</b><br>${x.variationZh}<div class="audio-row"><button class="audio-btn variation-audio">🔊 替換句正常</button><button class="audio-btn slow variation-audio">🐢 替換句慢速</button></div></div><div class="status-row"><button class="status-btn ${p[x.id]==="new"?"selected":""}" data-s="new">😵 不會</button><button class="status-btn ${p[x.id]==="learning"?"selected":""}" data-s="learning">🤔 學習中</button><button class="status-btn ${p[x.id]==="mastered"?"selected":""}" data-s="mastered">😊 熟悉</button></div>`;const aud=d.querySelectorAll(".audio-btn");aud[0].onclick=()=>speak(x.read,.9);aud[1].onclick=()=>speak(x.read,.68);aud[2].onclick=()=>speak(x.variation,.9);aud[3].onclick=()=>speak(x.variation,.68);d.querySelectorAll(".status-btn").forEach(b=>b.onclick=()=>setStatus(x.id,b.dataset.s,id));$("phraseContainer").appendChild(d)})}
function setStatus(id,status,cat){const p=getProgress();p[id]=status;saveProgress(p);updateDashboard();openCategory(cat)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab+"-section").classList.add("active");if(b.dataset.tab==="wrong")renderWrong()})

const PHRASE_STAT_KEY="jlptPhraseQuizStatsFinal";
let score=0,correct=0,wrong=0,current=null,quizQueue=[],quizIndex=0,quizRunMode="normal",quizReview=[];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getPhraseStats(){try{return JSON.parse(localStorage.getItem(PHRASE_STAT_KEY)||"{}")}catch{return {}}}
function savePhraseStats(x){localStorage.setItem(PHRASE_STAT_KEY,JSON.stringify(x))}
function updateScore(){$("score").textContent=score;$("correct").textContent=correct;$("wrong").textContent=wrong;$("quizPos").textContent=`${Math.min(quizIndex+1,quizQueue.length)}/${quizQueue.length}`;$("quizFill").style.width=(quizQueue.length?Math.min(100,quizIndex/quizQueue.length*100):0)+"%"}
function phraseWeakScore(x){const s=getPhraseStats()[x.id]||{c:0,w:0,streak:0};return s.w*3-s.c*.4-s.streak}
function phrasePool(){return allPhrases.filter(x=>$("quizCat").value==="ALL"||x.categoryId===$("quizCat").value)}
function startQuiz(mode="normal"){
 quizRunMode=mode;score=correct=wrong=0;quizIndex=0;quizReview=[];let pool=phrasePool();
 if(mode==="wrong"){const ids=new Set(getWrong());pool=pool.filter(x=>ids.has(x.id));if(!pool.length)return alert("目前這個情境沒有錯題。")}
 if(mode==="weak")pool=[...pool].sort((a,b)=>phraseWeakScore(b)-phraseWeakScore(a)+((Math.random()-.5)*1.2));else pool=shuffle(pool);
 const n=$("quizCount").value==="full"?pool.length:Number($("quizCount").value);quizQueue=pool.slice(0,Math.min(n,pool.length));if(!quizQueue.length)return alert("目前沒有可用題目。");updateScore();renderPhraseQuestion()
}
function makePhraseQuestion(x){
 const mode=$("quizMode").value;let prompt,question,answer,pool;
 if(mode==="zh-jp"){prompt="請依中文情境選出最適當的日文。";question=`情境：「${x.zh}」`;answer=x.jp;pool=[...allPhrases.filter(y=>y.id!==x.id&&y.categoryId===x.categoryId),...allPhrases.filter(y=>y.id!==x.id&&y.categoryId!==x.categoryId)].map(y=>y.jp)}
 else if(mode==="jp-zh"){prompt="請選出這句日文的正確中文意思。";question=x.jp;answer=x.zh;pool=[...allPhrases.filter(y=>y.id!==x.id&&y.categoryId===x.categoryId),...allPhrases.filter(y=>y.id!==x.id&&y.categoryId!==x.categoryId)].map(y=>y.zh)}
 else if(mode==="listen"){prompt='🔊 聽完日文後，選出正確中文。';question="🎧 請仔細聽";answer=x.zh;pool=[...allPhrases.filter(y=>y.id!==x.id&&y.categoryId===x.categoryId),...allPhrases.filter(y=>y.id!==x.id&&y.categoryId!==x.categoryId)].map(y=>y.zh)}
 else{prompt="想像你正在日本遇到以下情境，選出最適合直接說的一句。";question=x.tip;answer=x.jp;pool=allPhrases.filter(y=>y.id!==x.id&&y.categoryId===x.categoryId).map(y=>y.jp);if(pool.length<3)pool=[...allPhrases.filter(y=>y.id!==x.id&&y.categoryId===x.categoryId),...allPhrases.filter(y=>y.id!==x.id&&y.categoryId!==x.categoryId)].map(y=>y.jp)}
 return {prompt,question,answer,options:shuffle([answer,...shuffle([...new Set(pool)]).slice(0,3)])}
}
function renderPhraseQuestion(){
 if(quizIndex>=quizQueue.length)return renderPhraseResult();current=quizQueue[quizIndex];const q=makePhraseQuestion(current);
 $("quizPrompt").innerHTML=q.prompt+($("quizMode").value==="listen"?' <button class="audio-btn" onclick="speak(current.read,.8)">再聽一次</button>':"");$("quizQuestion").textContent=q.question;$("feedback").textContent="";$("quizExplain").style.display="none";$("nextBtn").style.display="none";$("options").innerHTML="";
 q.options.forEach(o=>{const b=document.createElement("button");b.className="option";b.textContent=o;b.onclick=()=>checkAnswer(o,b,q.answer);$("options").appendChild(b)});
 if($("quizMode").value==="listen")setTimeout(()=>speak(current.read,.8),180);updateScore()
}
function updatePhraseStat(x,ok){
 const all=getPhraseStats(),s=all[x.id]||{c:0,w:0,streak:0};s[ok?"c":"w"]++;s.streak=ok?s.streak+1:0;s.last=Date.now();all[x.id]=s;savePhraseStats(all);
 let ids=getWrong();if(ok&&s.streak>=2)ids=ids.filter(i=>i!==x.id);if(!ok)ids.push(x.id);saveWrong(ids)
}
function checkAnswer(sel,btn,ans){
 const bs=$("options").querySelectorAll(".option");bs.forEach(b=>b.disabled=true);const ok=sel===ans;
 if(ok){score+=10;correct++;$("feedback").style.color="#2e7d32";$("feedback").textContent="⭕ 答對了！";btn.style.background="#dcedc8"}else{wrong++;$("feedback").style.color="#c62828";$("feedback").textContent=`❌ 答錯了。正確答案：${ans}`;btn.style.background="#ffcdd2";bs.forEach(b=>{if(b.textContent===ans)b.style.background="#dcedc8"})}
 updatePhraseStat(current,ok);quizReview.push({x:current,ok,sel,ans});updateScore();updateDashboard();
 $("quizExplain").innerHTML=`<b>📘 老師詳解</b><br><br><b>${current.jp}</b><br><span style="color:#777">${current.read} ｜ ${current.romaji}</span><br>🇹🇼 ${current.zh}<br><br>💡 ${current.tip}<br><br>🔍 ${current.explain}<br><br>🔄 <b>${current.variation}</b><br>${current.variationZh}<div class="audio-row"><button class="audio-btn" onclick="speak(current.read,.9)">🔊 主句正常</button><button class="audio-btn slow" onclick="speak(current.read,.68)">🐢 主句慢速</button><button class="audio-btn" onclick="speak(current.variation,.9)">🔊 替換句正常</button><button class="audio-btn slow" onclick="speak(current.variation,.68)">🐢 替換句慢速</button></div>`;
 $("quizExplain").style.display="block";$("nextBtn").textContent=quizIndex===quizQueue.length-1?"查看結果":"下一題 ➜";$("nextBtn").style.display="inline-block"
}
function nextQuestion(){quizIndex++;renderPhraseQuestion()}
function renderPhraseResult(){
 const total=quizQueue.length,pct=Math.round(correct/Math.max(1,total)*100),cats={};quizReview.forEach(r=>{let k=r.x.categoryId;cats[k]??={c:0,n:0};cats[k].n++;if(r.ok)cats[k].c++});
 const arr=Object.entries(cats).map(([k,v])=>({k,p:Math.round(v.c/v.n*100),n:v.n,name:phraseCategories.find(c=>c.id===k)?.name||k})).sort((a,b)=>a.p-b.p);
 $("quizPrompt").textContent="";$("quizQuestion").textContent="";$("options").innerHTML="";$("feedback").textContent="";$("nextBtn").style.display="none";$("quizFill").style.width="100%";$("quizExplain").style.display="block";
 $("quizExplain").innerHTML=`<div class="final-result"><h2>🎓 情境片語驗收完成</h2><div class="big-score">${pct}%</div><p>${pct>=90?"情境反應很穩定。":pct>=75?"整體不錯，再加強低分情境。":"建議回到低分情境重新聽讀與替換練習。"}</p><div class="diag-grid">${arr.map(a=>`<div class="diag"><b>${a.p}%</b>${a.name}<br><small>${a.n}題</small></div>`).join("")}</div>${quizReview.some(r=>!r.ok)?`<h3>📌 本回錯題</h3>${quizReview.filter(r=>!r.ok).map(r=>`<div class="review-item"><b>${r.x.jp}</b><br>${r.x.zh}<br>你的答案：${r.sel}<br>💡 ${r.x.explain}</div>`).join("")}`:"<p>🌟 本回沒有錯題。</p>"}<div class="final-actions"><button class="start-btn" onclick="startQuiz('normal')">再測一次</button><button class="weak-btn" onclick="startQuiz('weak')">弱點特訓</button><button class="wrong-retry" onclick="startQuiz('wrong')">錯題再測</button></div></div>`
}
function renderWrong(){const ids=getWrong(),box=$("wrongContainer"),stats=getPhraseStats();box.innerHTML="";if(!ids.length){box.innerHTML='<div class="empty">🎉 目前沒有錯題！錯題連續答對兩次後會自動移出。</div>';return}ids.forEach(id=>{const x=allPhrases.find(p=>p.id===id);if(!x)return;const s=stats[id]||{c:0,w:0,streak:0};const d=document.createElement("div");d.className="wrong-card";d.innerHTML=`<b>${x.jp}</b><br><span style="color:#777">${x.read}</span><br>${x.zh}<br><br>💡 ${x.explain}<br><small>答對 ${s.c}｜答錯 ${s.w}｜目前連對 ${s.streak}</small>`;box.appendChild(d)})}
function clearWrong(){if(confirm("確定要清除全部片語錯題嗎？")){saveWrong([]);renderWrong();updateDashboard()}}
function init(){phraseCategories.forEach(c=>{[$("catFilter"),$("quizCat")].forEach(s=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.name;s.appendChild(o)})});updateDashboard();renderCategories();if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}}
init();
</script><script>
/* 全站共用學習摘要：phrases */
(function(){
 const K="jlptLearningCenterProgressV1";
 function sync(){try{const s=JSON.parse(localStorage.getItem(K)||"{}");const raw=localStorage.getItem("jlptPhraseProgress")||"";s.phrases={updatedAt:new Date().toISOString(),hasRecord:!!raw,summary:raw?"已有片語學習紀錄":"尚未開始片語"};localStorage.setItem(K,JSON.stringify(s));}catch(e){}}
 window.addEventListener("pagehide",sync);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")sync();});setTimeout(sync,300);
})();
</script>
</body></html>
