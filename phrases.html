const phraseCategories=rawCategories.map(([id,name,en,items])=>({id,name,en,items:items.map((x,i)=>({id:`${id}-${String(i+1).padStart(2,"0")}`,categoryId:id,category:name,jp:x[0],read:x[1],romaji:x[2],zh:x[3],tip:x[4],explain:x[5],variation:x[6],variationZh:x[7]}))}));
const allPhrases=phraseCategories.flatMap(c=>c.items);
const $=id=>document.getElementById(id);
function getProgress(){try{return JSON.parse(localStorage.getItem("jlptPhraseProgress")||"{}")}catch{return {}}}
function saveProgress(x){localStorage.setItem("jlptPhraseProgress",JSON.stringify(x))}
function getWrong(){try{return JSON.parse(localStorage.getItem("jlptPhraseWrong")||"[]")}catch{return []}}
function saveWrong(x){localStorage.setItem("jlptPhraseWrong",JSON.stringify([...new Set(x)]))}
function getVoice(){return speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("ja"))}
function speak(text,rate=.9){if(!("speechSynthesis" in window))return alert("目前瀏覽器不支援語音朗讀。");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=rate;const v=getVoice();if(v)u.voice=v;speechSynthesis.speak(u)}
function updateDashboard(){const p=getProgress();$("total").textContent=allPhrases.length;$("catCount").textContent=phraseCategories.length;$("mastered").textContent=allPhrases.filter(x=>p[x.id]==="mastered").length;$("wrongCount").textContent=getWrong().length}
function filtered(items=allPhrases){const q=$("search").value.trim().toLowerCase(),c=$("catFilter").value,s=$("statusFilter").value,p=getProgress();return items.filter(x=>{const text=[x.jp,x.read,x.romaji,x.zh,x.tip,x.explain,x.variation,x.category].join(" ").toLowerCase();return(!q||text.includes(q))&&(c==="ALL"||x.categoryId===c)&&(s==="ALL"||(s==="new"?!p[x.id]:p[x.id]===s))})}
function renderCategories(){$("categoryView").style.display="block";$("detailView").style.display="none";const list=filtered();$("summary").textContent=`📚 目前條件共有 ${list.length} 個實用片語`;const grid=$("categoryGrid");grid.innerHTML="";phraseCategories.forEach(c=>{const items=list.filter(x=>x.categoryId===c.id);if(!items.length)return;const d=document.createElement("div");d.className="cat";d.innerHTML=`<div class="cat-icon">${c.name.split(" ")[0]}</div><div class="cat-title">${c.name.replace(/^\S+\s/,"")}</div><div class="cat-count">${items.length} 個片語</div>`;d.onclick=()=>openCategory(c.id);grid.appendChild(d)});if(!list.length)grid.innerHTML='<div class="empty">找不到符合條件的片語。</div>'}
function openCategory(id){const c=phraseCategories.find(x=>x.id===id);const items=filtered(c.items);$("categoryView").style.display="none";$("detailView").style.display="block";$("detailTitle").textContent=`${c.name}（${items.length}）`;$("phraseContainer").innerHTML="";const p=getProgress();items.forEach(x=>{const d=document.createElement("div");d.className="phrase-card";d.innerHTML=`<div class="phrase-jp">${x.jp}</div><div class="read">${x.read} ｜ ${x.romaji}</div><div class="zh">🇹🇼 ${x.zh}</div><div class="teacher">👨‍🏫 <b>老師提醒：</b>${x.tip}</div><div class="explain"><b>🔍 句子拆解／用法：</b><br>${x.explain}</div><div class="variation"><b>🔄 替換練習：</b><br><b>${x.variation}</b><br>${x.variationZh}</div><div class="audio-row"><button class="audio-btn">🔊 正常</button><button class="audio-btn slow">🐢 慢速</button></div><div class="status-row"><button class="status-btn ${p[x.id]==="new"?"selected":""}" data-s="new">😵 不會</button><button class="status-btn ${p[x.id]==="learning"?"selected":""}" data-s="learning">🤔 學習中</button><button class="status-btn ${p[x.id]==="mastered"?"selected":""}" data-s="mastered">😊 熟悉</button></div>`;const aud=d.querySelectorAll(".audio-btn");aud[0].onclick=()=>speak(x.read,.9);aud[1].onclick=()=>speak(x.read,.68);d.querySelectorAll(".status-btn").forEach(b=>b.onclick=()=>setStatus(x.id,b.dataset.s,id));$("phraseContainer").appendChild(d)})}
function setStatus(id,status,cat){const p=getProgress();p[id]=status;saveProgress(p);updateDashboard();openCategory(cat)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab+"-section").classList.add("active");if(b.dataset.tab==="wrong")renderWrong()})
let score=0,correct=0,wrong=0,current=null,last=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){score=correct=wrong=0;last=null;updateScore();nextQuestion()}
function updateScore(){$("score").textContent=score;$("correct").textContent=correct;$("wrong").textContent=wrong}
function nextQuestion(){$("feedback").textContent="";$("quizExplain").style.display="none";$("nextBtn").style.display="none";let pool=allPhrases.filter(x=>$("quizCat").value==="ALL"||x.categoryId===$("quizCat").value);let alt=pool.filter(x=>x.id!==last);if(alt.length)pool=alt;current=pool[Math.floor(Math.random()*pool.length)];last=current.id;const mode=$("quizMode").value;let correctText,wrongPool;if(mode==="zh-jp"){$("quizPrompt").textContent="請依中文情境選出最適當的日文。";$("quizQuestion").textContent=`情境：「${current.zh}」`;correctText=current.jp;wrongPool=allPhrases.filter(x=>x.id!==current.id).map(x=>x.jp)}else if(mode==="jp-zh"){$("quizPrompt").textContent="請選出這句日文的正確中文意思。";$("quizQuestion").textContent=current.jp;correctText=current.zh;wrongPool=allPhrases.filter(x=>x.id!==current.id).map(x=>x.zh)}else{$("quizPrompt").innerHTML='🔊 聽完日文後，選出正確中文。 <button class="audio-btn" onclick="speak(current.read,.8)">再聽一次</button>';$("quizQuestion").textContent="🎧 請仔細聽";correctText=current.zh;wrongPool=allPhrases.filter(x=>x.id!==current.id).map(x=>x.zh);setTimeout(()=>speak(current.read,.8),150)}const opts=[correctText,...shuffle([...new Set(wrongPool)]).slice(0,3)];$("options").innerHTML="";shuffle(opts).forEach(o=>{const b=document.createElement("button");b.className="option";b.textContent=o;b.onclick=()=>checkAnswer(o,b,correctText);$("options").appendChild(b)})}
function checkAnswer(sel,btn,ans){const bs=$("options").querySelectorAll(".option");bs.forEach(b=>b.disabled=true);if(sel===ans){score+=10;correct++;$("feedback").style.color="#2e7d32";$("feedback").textContent="⭕ 答對了！";btn.style.background="#dcedc8"}else{wrong++;$("feedback").style.color="#c62828";$("feedback").textContent=`❌ 答錯了。正確答案：${ans}`;btn.style.background="#ffcdd2";bs.forEach(b=>{if(b.textContent===ans)b.style.background="#dcedc8"});const w=getWrong();w.push(current.id);saveWrong(w)}updateScore();updateDashboard();$("quizExplain").innerHTML=`<b>📘 老師詳解</b><br><br><b>${current.jp}</b><br><span style="color:#777">${current.read} ｜ ${current.romaji}</span><br>🇹🇼 ${current.zh}<br><br>💡 ${current.tip}<br><br>🔍 ${current.explain}<br><br>🔄 <b>${current.variation}</b><br>${current.variationZh}<div class="audio-row"><button class="audio-btn" onclick="speak(current.read,.9)">🔊 正常</button><button class="audio-btn slow" onclick="speak(current.read,.68)">🐢 慢速</button></div>`;$("quizExplain").style.display="block";$("nextBtn").style.display="inline-block"}
function renderWrong(){const ids=getWrong(),box=$("wrongContainer");box.innerHTML="";if(!ids.length){box.innerHTML='<div class="empty">🎉 目前沒有錯題！</div>';return}ids.forEach(id=>{const x=allPhrases.find(p=>p.id===id);if(!x)return;const d=document.createElement("div");d.className="wrong-card";d.innerHTML=`<b>${x.jp}</b><br><span style="color:#777">${x.read}</span><br>${x.zh}<br><br>💡 ${x.explain}`;box.appendChild(d)})}
function clearWrong(){if(confirm("確定要清除全部片語錯題嗎？")){saveWrong([]);renderWrong();updateDashboard()}}
function init(){phraseCategories.forEach(c=>{[$("catFilter"),$("quizCat")].forEach(s=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.name;s.appendChild(o)})});updateDashboard();renderCategories();if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}}
init();
</script></body></html>
