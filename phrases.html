<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第四階段：JLPT N5 實用生活與旅遊片語網</title>
    <style>
        :root {
            --primary-color: #d81b60;
            --bg-color: #fce4ec;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: #f8bbd0;
            color: #880e4f;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        
        /* 片語分類卡片 */
        .category-group {
            margin-bottom: 30px;
        }
        .category-title {
            font-size: 20px;
            font-weight: bold;
            color: #ad1457;
            margin-bottom: 15px;
            border-bottom: 2px solid #f8bbd0;
            padding-bottom: 5px;
        }
        .phrase-card {
            background: #fff0f5;
            border-left: 6px solid #ec407a;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .phrase-card:hover {
            background: #fce4ec;
            transform: translateY(-2px);
        }
        .phrase-jp {
            font-size: 19px;
            font-weight: bold;
            color: #880e4f;
        }
        .phrase-romaji {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }
        .phrase-zh {
            font-size: 15px;
            color: #444;
            margin-top: 5px;
            font-weight: bold;
        }
        .phrase-tip {
            font-size: 13px;
            color: #ad1457;
            margin-top: 5px;
            font-style: italic;
        }

        /* 測驗區樣式 */
        .quiz-box {
            text-align: center;
        }
        .quiz-question {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--primary-color);
            line-height: 1.5;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #f8bbd0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #fce4ec;
            border-color: #d81b60;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }
        .feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .next-btn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #d81b60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🗣️ 第四階段：實用生活與旅遊片語網</h1>
        <p>掌握日本旅遊、購物、餐飲與日常社交最實用的高頻情境對話！</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('phrases')">📖 情境片語總表</button>
        <button class="tab-btn" onclick="switchTab('quiz')">✍️ 情境實戰考驗</button>
    </div>

    <div class="container">
        <!-- 第一部分：片語總表 -->
        <div id="phrases-section" class="section active">
            <h3>點擊任一片語卡片即可聆聽標準日語發音：</h3>
            <div id="phrasesContainer"></div>
        </div>

        <!-- 第二部分：片語測驗區 -->
        <div id="quiz-section" class="section">
            <div class="quiz-box">
                <div class="score-board">目前得分：<span id="score">0</span> 分</div>
                <div id="quizPrompt" style="font-size: 16px; color: #666;">請問當遇到以下情境時，應該說哪一句日文？</div>
                <div class="quiz-question" id="quizQuestion"></div>
                <div class="options-grid" id="optionsGrid"></div>
                <div class="feedback" id="feedback"></div>
                <button class="next-btn" id="nextBtn" onclick="nextQuizQuestion()">下一題</button>
            </div>
        </div>
    </div>

    <script>
        // 實境生活與旅遊片語資料庫
        const phraseCategories = [
            {
                category: "🛍️ 購物與結帳篇 (Shopping)",
                items: [
                    { jp: "いくらですか。", read: "いくらですか", romaji: "ikura desu ka", zh: "請問多少錢？", tip: "買東西時最實用的一句話！" },
                    { jp: "これをください。", read: "これをください", romaji: "kore o kudasai", zh: "請給我這個。", tip: "指著商品時可以直接這樣說。" },
                    { jp: "袋は要りますか。", read: "ふくろはいりますか", romaji: "fukuro wa irimasu ka", zh: "需要塑膠袋嗎？", tip: "店員常問的句子，回答「はい（要）」或「いいえ（不用）」" },
                    { jp: "カードは使えますか。", read: "かーどはつかえますか", romaji: "kaado wa tsukaemasu ka", zh: "可以用信用卡嗎？", tip: "結帳時確認支付方式。" }
                ]
            },
            {
                category: "🍜 餐廳點餐與美食篇 (Dining)",
                items: [
                    { jp: "すみません、注文お願いします。", read: "すみません、ちゅうもんおねがいします", romaji: "sumimasen, chumon onegai shimasu", zh: "不好意思，我要點餐。", tip: "在日本餐廳呼叫服務生時使用。" },
                    { jp: "おすすめは何ですか。", read: "おすすめはなんですか", romaji: "osusume wa nan desu ka", zh: "推薦什麼呢？", tip: "不知道吃什麼時問店員最好。" },
                    { jp: "美味しかったです。ご馳走様でした。", read: "おいしかったです。ごちそうさまでした", romaji: "oishikatta desu. gochisousama deshita", zh: "很好吃。多謝款待。", tip: "吃飽結帳離開時對店員說的禮貌用語。" },
                    { jp: "水をお願いします。", read: "みずをおねがいします", romaji: "mizu o onegai shimasu", zh: "請給我水。", tip: "請求提供開水時使用。" }
                ]
            },
            {
                category: "🗺️ 問路與交通篇 (Travel & Directions)",
                items: [
                    { jp: "すみません、駅はどこですか。", read: "すみません、えきはどこですか", romaji: "sumimasen, eki wa doko desu ka", zh: "不好意思，車站在哪裡？", tip: "問路時的標準句型：～はどこですか。" },
                    { jp: "切符売り場はどこですか。", read: "きっぷうりばはどこですか", romaji: "kippu uriba wa doko desu ka", zh: "售票處在哪裡？", tip: "搭地鐵或電車時尋找買票口。" },
                    { jp: "英語が話せますか。", read: "えいごがはなせますか", romaji: "eigo ga hanasemasu ka", zh: "你會說英文嗎？", tip: "溝通困難時尋求協助。" }
                ]
            },
            {
                category: "🤝 日常社交與禮貌篇 (Social)",
                items: [
                    { jp: "おはようございます。", read: "おはようございます", romaji: "ohayou gozaimasu", zh: "早安。", tip: "上午見面的問候語。" },
                    { jp: "ありがとうございます。", read: "ありがとうございます", romaji: "arigatou gozaimasu", zh: "非常感謝。", tip: "最基本的道謝禮貌。" },
                    { jp: "すみません。", read: "すみません", romaji: "sumimasen", zh: "不好意思 / 謝謝。", tip: "在日本身兼道歉、感謝與引起注意的多功能用語。" },
                    { jp: "失礼します。", read: "しつれいします", romaji: "shitsurei shimasu", zh: "告辭了 / 失禮了。", tip: "進出房間或掛電話時使用。" }
                ]
            }
        ];

        const allPhrases = phraseCategories.flatMap(cat => cat.items);

        // 語音播放
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 渲染片語總表
        const container = document.getElementById('phrasesContainer');
        phraseCategories.forEach(cat => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'category-group';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'category-title';
            titleDiv.innerText = cat.category;
            groupDiv.appendChild(titleDiv);

            cat.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'phrase-card';
                card.innerHTML = `
                    <div class="phrase-jp">🔊 ${item.jp}</div>
                    <div class="phrase-romaji">${item.romaji}</div>
                    <div class="phrase-zh">${item.zh}</div>
                    <div class="phrase-tip">💡 老師提醒：${item.tip}</div>
                `;
                card.onclick = () => speak(item.read);
                groupDiv.appendChild(card);
            });

            container.appendChild(groupDiv);
        });

        // 切換頁籤
        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tabName === 'phrases') {
                document.getElementById('phrases-section').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('quiz-section').classList.add('active');
                event.target.classList.add('active');
                nextQuizQuestion();
            }
        }

        let currentScore = 0;
        let currentQuiz = {};

        function nextQuizQuestion() {
            document.getElementById('feedback').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';

            currentQuiz = allPhrases[Math.floor(Math.random() * allPhrases.length)];
            speak(currentQuiz.read); // 測驗時自動朗讀正確日文

            document.getElementById('quizQuestion').innerText = `情境：「 ${currentQuiz.zh} 」`;

            // 產生選項（1個對，3個錯）
            let options = [currentQuiz.jp];
            while (options.length < 4) {
                const randomWrong = allPhrases[Math.floor(Math.random() * allPhrases.length)].jp;
                if (!options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn, currentQuiz.jp);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption, btnElement, correctAns) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const feedback = document.getElementById('feedback');
            if (selectedOption === correctAns) {
                feedback.style.color = '#880e4f';
                feedback.innerText = '⭕ 答對了！實境應用能力滿分！';
                currentScore += 10;
                document.getElementById('score').innerText = currentScore;
                btnElement.style.background = '#f8bbd0';
            } else {
                feedback.style.color = '#c2185b';
                feedback.innerText = `❌ 答錯囉！正確答案是：【 ${correctAns} 】`;
                btnElement.style.background = '#ffebee';
                allBtns.forEach(b => {
                    if (b.innerText === correctAns) {
                        b.style.background = '#f8bbd0';
                    }
                });
            }
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    </script>
</body>
</html>
