<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二階段：日文基礎單字互動學習網</title>
    <style>
        :root {
            --primary-color: #3f51b5;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #333;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        
        /* 單字卡片區塊 */
        .category-group {
            margin-bottom: 25px;
        }
        .category-title {
            font-size: 18px;
            font-weight: bold;
            color: #3f51b5;
            margin-bottom: 12px;
            border-bottom: 2px solid #c5cae9;
            padding-bottom: 5px;
        }
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .vocab-card {
            background: #e8eaf6;
            border: 2px solid #c5cae9;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .vocab-card:hover {
            background: #d1c4e9;
            transform: translateY(-3px);
        }
        .vocab-jp {
            font-size: 18px;
            font-weight: bold;
            color: #1a237e;
        }
        .vocab-zh {
            font-size: 14px;
            color: #333;
            margin-top: 4px;
        }
        .vocab-romaji {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        /* 測驗區樣式 */
        .quiz-box {
            text-align: center;
        }
        .quiz-question {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--primary-color);
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }
        .feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .next-btn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 600px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>📘 日文基礎單字互動學習網</h1>
        <p>點擊單字卡聽發音，切換到測驗區挑戰你的單字力！</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('vocab')">📖 生活單字分類表</button>
        <button class="tab-btn" onclick="switchTab('quiz')">✍️ 單字隨機考驗</button>
    </div>

    <div class="container">
        <!-- 第一部分：單字分類表 -->
        <div id="vocab-section" class="section active">
            <h3>點擊單字卡即可聆聽日語發音：</h3>
            <div id="vocabContainer"></div>
        </div>

        <!-- 第二部分：單字測驗區 -->
        <div id="quiz-section" class="section">
            <div class="quiz-box">
                <div class="score-board">目前得分：<span id="score">0</span> 分</div>
                <div id="quizPrompt" style="font-size: 16px; color: #666;"></div>
                <div class="quiz-question" id="quizQuestion">りんご</div>
                <div class="options-grid" id="optionsGrid"></div>
                <div class="feedback" id="feedback"></div>
                <button class="next-btn" id="nextBtn" onclick="nextQuizQuestion()">下一題</button>
            </div>
        </div>
    </div>

    <script>
        // 基礎單字資料庫（按主題分類）
        const vocabCategories = [
            { category: "🍎 日常食物與水果", items: [
                { jp: "りんご", romaji: "ringo", zh: "蘋果" },
                { jp: "みかん", romaji: "mikan", zh: "橘子" },
                { jp: "水(みず)", romaji: "mizu", zh: "水" },
                { jp: "茶(おちゃ)", romaji: "ocha", zh: "茶" },
                { jp: "肉(にく)", romaji: "niku", zh: "肉" },
                { jp: "魚(さかな)", romaji: "sakana", zh: "魚" }
            ]},
            { category: "🏠 生活與地點", items: [
                { jp: "家(いえ)", romaji: "ie", zh: "家" },
                { jp: "学校(がっこう)", romaji: "gakkou", zh: "學校" },
                { jp: "駅(えき)", romaji: "eki", zh: "車站" },
                { jp: "本(ほん)", romaji: "hon", zh: "書本" },
                { jp: "車(くるま)", romaji: "kuruma", zh: "汽車" },
                { jp: "店(みせ)", romaji: "mise", zh: "店鋪" }
            ]},
            { category: "👥 人物與稱謂", items: [
                { jp: "私(わたし)", romaji: "watashi", zh: "我" },
                { jp: "友達(ともだち)", romaji: "tomodachi", zh: "朋友" },
                { jp: "先生(せんせい)", romaji: "sensei", zh: "老師" },
                { jp: "学生(がくせい)", romaji: "gakusei", zh: "學生" },
                { jp: "父(ちち)", romaji: "chichi", zh: "父親" },
                { jp: "母(はは)", romaji: "haha", zh: "母親" }
            ]},
            { category: "⏰ 時間與數字", items: [
                { jp: "今日(きょう)", romaji: "kyou", zh: "今天" },
                { jp: "明日(あした)", romaji: "ashita", zh: "明天" },
                { jp: "時間(じかん)", romaji: "jikan", zh: "時間" },
                { jp: "一(いち)", romaji: "ichi", zh: "數字 1" },
                { jp: "二(に)", romaji: "ni", zh: "數字 2" },
                { jp: "三(さん)", romaji: "san", zh: "數字 3" }
            ]}
        ];

        const allVocab = vocabCategories.flatMap(cat => cat.items);

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/\(.*?\)/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        const container = document.getElementById('vocabContainer');
        vocabCategories.forEach(cat => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'category-group';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'category-title';
            titleDiv.innerText = cat.category;
            groupDiv.appendChild(titleDiv);

            const gridDiv = document.createElement('div');
            gridDiv.className = 'vocab-grid';

            cat.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="vocab-jp">${item.jp}</div>
                    <div class="vocab-zh">${item.zh}</div>
                    <div class="vocab-romaji">${item.romaji}</div>
                `;
                card.onclick = () => {
                    speak(item.jp);
                    card.style.background = '#c5cae9';
                    setTimeout(() => card.style.background = '#e8eaf6', 300);
                };
                gridDiv.appendChild(card);
            });

            groupDiv.appendChild(gridDiv);
            container.appendChild(groupDiv);
        });

        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tabName === 'vocab') {
                document.getElementById('vocab-section').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('quiz-section').classList.add('active');
                event.target.classList.add('active');
                nextQuizQuestion();
            }
        }

        let currentScore = 0;
        let currentItem = {};
        let quizMode = 1;

        function nextQuizQuestion() {
            document.getElementById('feedback').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';

            currentItem = allVocab[Math.floor(Math.random() * allVocab.length)];
            quizMode = Math.random() < 0.5 ? 1 : 2;

            let questionText = "";
            let promptText = "";
            let correctAns = "";
            let wrongPool = [];

            if (quizMode === 1) {
                promptText = "請問這個日文單字的意思是？";
                questionText = `${currentItem.jp} <span style="font-size:18px; color:#666;">(${currentItem.romaji})</span>`;
                speak(currentItem.jp);
                correctAns = currentItem.zh;
                wrongPool = allVocab.map(i => i.zh);
            } else {
                promptText = "請問這個中文意思對應的日文單字是？";
                questionText = currentItem.zh;
                correctAns = currentItem.jp;
                wrongPool = allVocab.map(i => i.jp);
            }

            document.getElementById('quizPrompt').innerText = promptText;
            document.getElementById('quizQuestion').innerHTML = questionText;

            let options = [correctAns];
            while (options.length < 4) {
                const randomWrong = wrongPool[Math.floor(Math.random() * wrongPool.length)];
                if (!options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn, correctAns);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption, btnElement, correctAns) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const feedback = document.getElementById('feedback');
            if (selectedOption === correctAns) {
                feedback.style.color = 'green';
                feedback.innerText = '⭕ 答對了！太棒了！';
                currentScore += 10;
                document.getElementById('score').innerText = currentScore;
                btnElement.style.background = '#d4edda';
            } else {
                feedback.style.color = 'red';
                feedback.innerText = `❌ 答錯了！正確答案是：${correctAns}`;
                btnElement.style.background = '#f8d7da';
                allBtns.forEach(b => {
                    if (b.innerText === correctAns) {
                        b.style.background = '#d4edda';
                    }
                });
            }
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    </script>
</body>
</html>
