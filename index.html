<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一階段：日文 50 音互動學習網</title>
    <style>
        :root {
            --primary-color: #ff5252;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #333;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        /* 五十音表格樣式 */
        .grid-table {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .kana-card {
            background: #fff5f5;
            border: 2px solid #ffcccc;
            border-radius: 8px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .kana-card:hover {
            background: #ffe6e6;
            transform: translateY(-3px);
        }
        .kana-char {
            font-size: 24px;
            font-weight: bold;
            color: #d32f2f;
        }
        .kana-romaji {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        /* 測驗區樣式 */
        .quiz-box {
            text-align: center;
        }
        .quiz-question {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--primary-color);
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }
        .feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .next-btn {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 日文 50 音互動學習網</h1>
        <p>點擊字卡聽發音，或切換到測驗區自我挑戰！</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('table')">📖 50音清音表</button>
        <button class="tab-btn" onclick="switchTab('quiz')">✍️ 互動測驗挑戰</button>
    </div>

    <div class="container">
        <!-- 第一部分：50音表 -->
        <div id="table-section" class="section active">
            <h3>點擊下方字卡即可聆聽日語發音：</h3>
            <div class="grid-table" id="kanaGrid"></div>
        </div>

        <!-- 第二部分：測驗區 -->
        <div id="quiz-section" class="section">
            <div class="quiz-box">
                <div class="score-board">目前得分：<span id="score">0</span> 分</div>
                <p>請問這個假名怎麼唸？</p>
                <div class="quiz-question" id="quizQuestion">あ</div>
                <div class="options-grid" id="optionsGrid"></div>
                <div class="feedback" id="feedback"></div>
                <button class="next-btn" id="nextBtn" onclick="nextQuizQuestion()">下一題</button>
            </div>
        </div>
    </div>

    <script>
        // 50音基礎資料（清音）
        const kanaData = [
            {h: "あ", r: "a"}, {h: "い", r: "i"}, {h: "う", r: "u"}, {h: "え", r: "e"}, {h: "お", r: "o"},
            {h: "か", r: "ka"}, {h: "き", r: "ki"}, {h: "く", r: "ku"}, {h: "け", r: "ke"}, {h: "こ", r: "ko"},
            {h: "さ", r: "sa"}, {h: "し", r: "shi"}, {h: "す", r: "su"}, {h: "せ", r: "se"}, {h: "そ", r: "so"},
            {h: "た", r: "ta"}, {h: "ち", r: "chi"}, {h: "つ", r: "tsu"}, {h: "て", r: "te"}, {h: "と", r: "to"},
            {h: "な", r: "na"}, {h: "に", r: "ni"}, {h: "ぬ", r: "nu"}, {h: "ね", r: "ne"}, {h: "の", r: "no"},
            {h: "は", r: "ha"}, {h: "ひ", r: "hi"}, {h: "ふ", r: "fu"}, {h: "へ", r: "he"}, {h: "ほ", r: "ho"},
            {h: "ま", r: "ma"}, {h: "み", r: "mi"}, {h: "む", r: "mu"}, {h: "め", r: "me"}, {h: "も", r: "mo"},
            {h: "や", r: "ya"}, {h: "ゆ", r: "yu"}, {h: "よ", r: "yo"},
            {h: "ら", r: "ra"}, {h: "り", r: "ri"}, {h: "る", r: "ru"}, {h: "れ", r: "re"}, {h: "ろ", r: "ro"},
            {h: "わ", r: "wa"}, {h: "を", r: "wo"}, {h: "ん", r: "n"}
        ];

        // 語音播放函數
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止上一個發音
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP'; // 設定為日語
                utterance.rate = 0.9; // 稍微放慢語速，適合學習
                window.speechSynthesis.speak(utterance);
            } else {
                alert("您的瀏覽器不支援語音功能");
            }
        }

        // 初始化 50音表格
        const grid = document.getElementById('kanaGrid');
        kanaData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'kana-card';
            card.innerHTML = `<div class="kana-char">${item.h}</div><div class="kana-romaji">${item.r}</div>`;
            card.onclick = () => {
                speak(item.h);
                card.style.background = '#ffcccc';
                setTimeout(() => card.style.background = '#fff5f5', 300);
            };
            grid.appendChild(card);
        });

        // 切換頁籤功能
        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tabName === 'table') {
                document.getElementById('table-section').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('quiz-section').classList.add('active');
                event.target.classList.add('active');
                nextQuizQuestion();
            }
        }

        // 測驗變數
        let currentScore = 0;
        let currentCorrectAnswer = {};

        // 隨機出題
        function nextQuizQuestion() {
            document.getElementById('feedback').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';

            // 隨機選一個題目
            const randomIndex = Math.floor(Math.random() * kanaData.length);
            currentCorrectAnswer = kanaData[randomIndex];

            document.getElementById('quizQuestion').innerText = currentCorrectAnswer.h;
            // 自動順便念出聲音提示（也可以拿掉這行讓純聽力挑戰）
            speak(currentCorrectAnswer.h);

            // 產生 3 個錯誤選項 + 1 個正確選項
            let options = [currentCorrectAnswer.r];
            while (options.length < 4) {
                const randomWrong = kanaData[Math.floor(Math.random() * kanaData.length)].r;
                if (!options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }
            // 打亂順序
            options.sort(() => Math.random() - 0.5);

            // 渲染選項按鈕
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsGrid.appendChild(btn);
            });
        }

        // 檢查答案
        function checkAnswer(selectedOption, btnElement) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true); // 鎖定按鈕

            const feedback = document.getElementById('feedback');
            if (selectedOption === currentCorrectAnswer.r) {
                feedback.style.color = 'green';
                feedback.innerText = '⭕ 答對了！太棒了！';
                currentScore += 10;
                document.getElementById('score').innerText = currentScore;
                btnElement.style.background = '#d4edda';
            } else {
                feedback.style.color = 'red';
                feedback.innerText = `❌ 答錯了！正確答案是：${currentCorrectAnswer.r}`;
                btnElement.style.background = '#f8d7da';
                // 找出正確按鈕標示出來
                allBtns.forEach(b => {
                    if (b.innerText === currentCorrectAnswer.r) {
                        b.style.background = '#d4edda';
                    }
                });
            }
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
    </script>
</body>
</html>
