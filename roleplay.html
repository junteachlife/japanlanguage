<title>第五階段：JLPT N5 AI 情境角色扮演</title>

<style>
:root{
    --primary:#673ab7;
    --primary-dark:#512da8;
    --light:#ede7f6;
    --card:#ffffff;
    --text:#333;
    --green:#2e7d32;
}

*{
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "Helvetica Neue",Arial,sans-serif;

    background:var(--light);
    color:var(--text);

    margin:0;
    padding:20px;

    display:flex;
    flex-direction:column;
    align-items:center;
}

header{
    text-align:center;
    margin-bottom:20px;
}

h1{
    color:var(--primary);
    margin-bottom:8px;
}

header p{
    color:#555;
    line-height:1.7;
}

.container{
    width:100%;
    max-width:900px;

    background:white;

    padding:25px;

    border-radius:16px;

    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.back-link{
    display:inline-block;

    margin-bottom:18px;

    color:var(--primary-dark);

    text-decoration:none;

    font-weight:bold;
}

.scenario-select{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;

    gap:10px;

    margin-bottom:20px;
}

.sc-btn{
    padding:10px 14px;

    border:2px solid #b39ddb;

    border-radius:22px;

    background:white;

    color:var(--primary-dark);

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.sc-btn:hover,
.sc-btn.active{

    background:var(--primary);

    border-color:var(--primary);

    color:white;
}

.scenario-info{

    background:#f7f4fc;

    border-left:5px solid var(--primary);

    padding:12px 15px;

    border-radius:8px;

    margin-bottom:15px;

    line-height:1.6;
}

.chat-box{

    height:460px;

    overflow-y:auto;

    padding:15px;

    background:#fafafa;

    border:2px solid #d1c4e9;

    border-radius:12px;

    display:flex;

    flex-direction:column;

    gap:12px;

    scroll-behavior:smooth;
}

.message{

    max-width:82%;

    padding:12px 16px;

    border-radius:14px;

    line-height:1.65;

    font-size:16px;

    animation:fadeIn .25s ease;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.npc{

    align-self:flex-start;

    background:#e8eaf6;

    color:#1a237e;

    border-bottom-left-radius:3px;
}

.message.user{

    align-self:flex-end;

    background:var(--primary);

    color:white;

    border-bottom-right-radius:3px;
}

.jp{

    font-size:18px;

    font-weight:bold;
}

.zh{

    display:block;

    margin-top:4px;

    font-size:13px;

    opacity:.78;
}

.speaker-btn{

    margin-top:7px;

    border:none;

    background:rgba(255,255,255,.75);

    color:#4527a0;

    padding:5px 9px;

    border-radius:12px;

    cursor:pointer;

    font-size:12px;
}

.user .speaker-btn{

    color:white;

    background:rgba(255,255,255,.18);
}

.status-bar{

    text-align:center;

    padding:10px;

    min-height:42px;

    color:#666;

    font-size:14px;
}

.status-speaking{

    color:var(--primary);

    font-weight:bold;
}

.choices-area{

    display:flex;

    flex-direction:column;

    gap:10px;
}

.choice-btn{

    padding:13px 15px;

    font-size:16px;

    border:2px solid #9575cd;

    border-radius:10px;

    background:white;

    color:#311b92;

    cursor:pointer;

    text-align:left;

    line-height:1.55;

    transition:.2s;
}

.choice-btn:hover:not(:disabled){

    background:#ede7f6;

    transform:translateY(-1px);
}

.choice-btn:disabled{

    opacity:.45;

    cursor:not-allowed;
}

.end-box{

    text-align:center;

    background:#e8f5e9;

    border:1px solid #a5d6a7;

    color:#256029;

    padding:15px;

    border-radius:10px;

    margin-top:5px;
}

.restart-btn{

    border:none;

    background:var(--green);

    color:white;

    padding:11px 18px;

    border-radius:8px;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .container{
        padding:15px;
    }

    h1{
        font-size:24px;
    }

    .chat-box{
        height:430px;
    }

    .message{
        max-width:90%;
    }

    .jp{
        font-size:17px;
    }

    .choice-btn{
        font-size:15px;
    }
}
</style>
</head>

jp:"すみません、コンビニはどこですか。",
zh:"不好意思，便利商店在哪裡？",
next:"q3"
}

]

},


q2:{

npc:"この道をまっすぐ行ってください。",

zh:"請沿著這條路直走。",

choices:[

{
jp:"どのくらいかかりますか。",
zh:"大概要多久？",
next:"q4"
},

{
jp:"右ですか、左ですか。",
zh:"是在右邊還是左邊？",
next:"q5"
}

]

},


q3:{

npc:"次の交差点を右に曲がるとあります。",

zh:"下一個十字路口右轉就會看到。",

choices:[

{
jp:"歩いて何分ぐらいですか。",
zh:"走路大約幾分鐘？",
next:"q4"
}

]

},


q4:{

npc:"歩いて5分ぐらいです。",

zh:"走路大約5分鐘。",

choices:[

{
jp:"近いですね。ありがとうございます。",
zh:"很近呢，謝謝。",
next:"q6"
}

]

},


q5:{

npc:"駅は左側にあります。",

zh:"車站在左手邊。",

choices:[

{
jp:"わかりました。ありがとうございます。",
zh:"知道了，謝謝。",
next:"q6"
}

]

},


q6:{

npc:"どういたしまして。お気をつけて。",

zh:"不客氣，路上小心。",

end:true

}

}

}

};


/* ==========================================================
   系統狀態
========================================================== */

let currentKey="convenience";

let currentNode=null;

let isSpeaking=false;


/* ==========================================================
   DOM
========================================================== */

const chatBox=
document.getElementById("chatBox");

const choicesArea=
document.getElementById("choicesArea");

const statusBar=
document.getElementById("statusBar");

const scenarioInfo=
document.getElementById("scenarioInfo");


/* ==========================================================
   找日文語音
========================================================== */

function getJapaneseVoice(){

const voices=
window.speechSynthesis.getVoices();

return voices.find(v=>
v.lang &&
v.lang.toLowerCase().startsWith("ja")
);

}


/* ==========================================================
   ★ 核心語音系統

   重點：
   不再使用固定 800ms。

   resolve 只會在整句真正朗讀完之後執行。
========================================================== */

function speakAsync(text){

return new Promise(resolve=>{

if(
!("speechSynthesis" in window) ||
!text
){

resolve();

return;

}

window.speechSynthesis.cancel();

isSpeaking=true;

updateStatus("🔊 正在朗讀，請聽完整句子……",true);


const utterance=
new SpeechSynthesisUtterance(text);

utterance.lang="ja-JP";

utterance.rate=.88;

utterance.pitch=1;

utterance.volume=1;


const japaneseVoice=
getJapaneseVoice();

if(japaneseVoice){

utterance.voice=
japaneseVoice;

}


utterance.onend=()=>{

isSpeaking=false;

updateStatus("");

resolve();

};


utterance.onerror=()=>{

isSpeaking=false;

updateStatus("");

resolve();

};


window.speechSynthesis.speak(
utterance
);

});

}


/* ==========================================================
   狀態列
========================================================== */

function updateStatus(text,speaking=false){

statusBar.textContent=text;

statusBar.classList.toggle(
"status-speaking",
speaking
);

}


/* ==========================================================
   新增 NPC 訊息
========================================================== */

function addNpcMessage(jp,zh){

const div=
document.createElement("div");

div.className=
"message npc";

div.innerHTML=`

🤖 <strong>店員／對方：</strong>

<br>

<span class="jp">
${jp}
</span>

<span class="zh">
${zh}
</span>

<button
class="speaker-btn"
type="button">
🔊 再聽一次
</button>

`;


div
.querySelector(".speaker-btn")
.addEventListener(
"click",
()=>speakAsync(jp)
);


chatBox.appendChild(div);

scrollBottom();

}


/* ==========================================================
   新增使用者訊息
========================================================== */

function addUserMessage(jp,zh){

const div=
document.createElement("div");

div.className=
"message user";

div.innerHTML=`

👤 <strong>你：</strong>

<br>

<span class="jp">
${jp}
</span>

<span class="zh">
${zh}
</span>

<button
class="speaker-btn"
type="button">
🔊 再聽一次
</button>

`;


div
.querySelector(".speaker-btn")
.addEventListener(
"click",
()=>speakAsync(jp)
);


chatBox.appendChild(div);

scrollBottom();

}


/* ==========================================================
   捲到底部
========================================================== */

function scrollBottom(){

requestAnimationFrame(()=>{

chatBox.scrollTop=
chatBox.scrollHeight;

});

}


/* ==========================================================
   鎖住選項
========================================================== */

function disableChoices(){

document
.querySelectorAll(".choice-btn")
.forEach(btn=>{

btn.disabled=true;

});

}


/* ==========================================================
   顯示目前 NPC 節點

   AI 必須完整說完
   才產生使用者選項。
========================================================== */

async function showNode(nodeId){

currentNode=nodeId;

const scenario=
scenarios[currentKey];

const node=
scenario.nodes[nodeId];


choicesArea.innerHTML="";


addNpcMessage(
node.npc,
node.zh
);


/*
AI 完整講完
*/

await speakAsync(
node.npc
);


/*
若是結束節點
*/

if(node.end){

showEnd();

return;

}


/*
AI 說完之後
才開放回答。
*/

renderChoices(
node.choices
);

}


/* ==========================================================
   顯示選項
========================================================== */

function renderChoices(choices){

choicesArea.innerHTML="";

updateStatus(
"👇 請選擇一句日語回答"
);


choices.forEach(choice=>{

const button=
document.createElement("button");

button.type="button";

button.className=
"choice-btn";

button.innerHTML=`

💬 <strong>
${choice.jp}
</strong>

<br>

<span style="
font-size:13px;
color:#666;
">
${choice.zh}
</span>

`;


button.addEventListener(
"click",
()=>chooseAnswer(choice)
);


choicesArea.appendChild(
button
);

});

}


/* ==========================================================
   ★ 使用者回答流程

   1. 鎖住按鈕
   2. 顯示使用者句子
   3. 完整念完使用者句子
   4. 稍微停頓
   5. AI 才講下一句
========================================================== */

async function chooseAnswer(choice){

if(isSpeaking){
return;
}


disableChoices();

choicesArea.innerHTML="";


addUserMessage(
choice.jp,
choice.zh
);


await speakAsync(
choice.jp
);


/*
自然停頓 350ms

注意：
這個等待是在「整句已經朗讀完成後」，
不是用來猜語音需要多久。
*/

await delay(350);


/*
使用者整句說完
才進入 AI 下一句。
*/

await showNode(
choice.next
);

}


/* ==========================================================
   完成情境
========================================================== */

function showEnd(){

updateStatus(
"🎉 情境練習完成！"
);

choicesArea.innerHTML=`

<div class="end-box">

<strong>
🎉 本次情境對話完成！
</strong>

<br>

可以重新練習，
或切換上方其他情境。

<br>

<button
class="restart-btn"
type="button"
onclick="restartScenario()">
🔄 再練習一次
</button>

</div>

`;

}


/* ==========================================================
   重新開始
========================================================== */

function restartScenario(){

window.speechSynthesis.cancel();

isSpeaking=false;

chatBox.innerHTML="";

choicesArea.innerHTML="";

updateStatus("");

const scenario=
scenarios[currentKey];

showNode(
scenario.start
);

}


/* ==========================================================
   切換情境
========================================================== */

function changeScenario(key,button){

window.speechSynthesis.cancel();

isSpeaking=false;

currentKey=key;


document
.querySelectorAll(".sc-btn")
.forEach(btn=>
btn.classList.remove("active")
);


button.classList.add(
"active"
);


chatBox.innerHTML="";

choicesArea.innerHTML="";

updateStatus("");


const scenario=
scenarios[key];


scenarioInfo.innerHTML=`

<strong>
${scenario.title}
</strong>

<br>

${scenario.description}

`;


showNode(
scenario.start
);

}


/* ==========================================================
   延遲
========================================================== */

function delay(ms){

return new Promise(
resolve=>
setTimeout(resolve,ms)
);

}


/* ==========================================================
   情境按鈕
========================================================== */

document
.querySelectorAll(".sc-btn")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

changeScenario(
button.dataset.key,
button
);

});

});


/* ==========================================================
   語音載入
========================================================== */

if(
"speechSynthesis" in window
){

window
.speechSynthesis
.getVoices();


window
.speechSynthesis
.onvoiceschanged=()=>{

window
.speechSynthesis
.getVoices();

};

}


/* ==========================================================
   初始化
========================================================== */

function init(){

const scenario=
scenarios[currentKey];

scenarioInfo.innerHTML=`

<strong>
${scenario.title}
</strong>

<br>

${scenario.description}

`;

showNode(
scenario.start
);

}

init();

</script>
