function normalizeTtsText(t){
 const exact={
   "張の名前で予約しています。":"チャンの名前で予約しています。",
   "張の名前で予約しています":"チャンの名前で予約しています"
 };
 return exact[t]||t||"";
}
function speak(t){return new Promise(r=>{
 t=normalizeTtsText(t);
 if(!t||!("speechSynthesis" in window))return r();
 window.speechSynthesis.cancel();speaking=true;$("status").textContent="🔊 正在朗讀……";
 let u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.88;
 let v=window.speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("ja"));if(v)u.voice=v;
 u.onend=u.onerror=()=>{speaking=false;$("status").textContent="";r()};
 window.speechSynthesis.speak(u)
})}
function msg(cls,j,z,hide=false){let d=document.createElement("div");d.className="msg "+cls;d.innerHTML=`<div class="jp">${j}</div><div class="zh" style="${hide?"display:none":""}">${z}</div><button class="speak">🔊 再聽一次</button>`;d.querySelector("button").onclick=()=>speak(j);$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight}
function keys(){let lv=$("level").value,x=stats(),a=Object.keys(scenarios).filter(k=>lv==="ALL"||scenarios[k].level===lv);if($("train").value==="wrong"){let q=new Set(Object.values(x.w).map(w=>w.k));a=a.filter(k=>q.has(k))}if($("train").value==="weak")a.sort((a,b)=>(x.s[a]?.best??-1)-(x.s[b]?.best??-1));return a}
function tabs(){let a=keys();$("tabs").innerHTML="";if(!a.length){$("tabs").innerHTML="🎉 此範圍沒有待重練情境";return}if(!a.includes(key))key=a[0];a.forEach(k=>{let b=document.createElement("button");b.className="tab "+(k===key?"on":"");b.textContent=scenarios[k].title+" · "+scenarios[k].level;b.onclick=()=>start(k);$("tabs").appendChild(b)})}
function start(k=key){speechSynthesis.cancel();key=k;i=score=max=streak=0;mistakes=[];$("chat").innerHTML=$("choices").innerHTML="";tabs();let s=scenarios[key];$("info").innerHTML=`<b>${s.title} · ${s.level}</b><br>${s.desc}<br><small>🎯 Can-do：${s.cando}</small>`;dash();show()}
async function show(){let s=scenarios[key],step=s.steps[i];$("bar").style.width=Math.round(i/(s.steps.length-1)*100)+"%";let hide=$("mode").value!=="learn";msg("npc",step[0],step[1],hide);if(i>0||$("mode").value!=="listen")await speak(step[0]);if(!step[2].length)return finish();$("status").textContent="👇 選擇最適合的回答";$("choices").innerHTML="";[...step[2]].sort(()=>Math.random()-.5).forEach(c=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<b>${c[0]}</b><div class="zh" style="${hide?"display:none":""}">${c[1]}</div>`;b.onclick=()=>choose(c);$("choices").appendChild(b)})}
async function choose(c){if(speaking)return;$("choices").innerHTML="";msg("me",c[0],c[1]);await speak(c[0]);score+=c[2];max+=2;let x=stats(),id=key+"|"+i+"|"+c[0];if(c[2]<2){streak=0;mistakes.push(c);x.w[id]={k:key,j:c[0],note:c[3],n:(x.w[id]?.n||0)+1}}else{streak++;if(x.w[id]){x.w[id].ok=(x.w[id].ok||0)+1;if(x.w[id].ok>=2)delete x.w[id]}}save(x);dash();let cls=c[2]===2?"good":c[2]===1?"mid":"bad",lab=c[2]===2?"⭕ 自然正確":c[2]===1?"△ 可以理解":"❌ 建議修正";$("choices").innerHTML=`<div class="feedback ${cls}"><b>${lab}</b><br>👨‍🏫 ${c[3]||"表達自然。"}<br><button class="next">繼續對話 ➜</button></div>`;$("choices").querySelector("button").onclick=()=>{i++;show()}}
function finish(){let pct=Math.round(score/Math.max(1,max)*100),x=stats(),o=x.s[key]||{};x.s[key]={done:true,best:Math.max(o.best||0,pct),last:pct,plays:(o.plays||0)+1};save(x);dash();$("bar").style.width="100%";$("choices").innerHTML=`<div class="end"><b>🎉 任務完成</b><div class="score">${pct}%</div><p>${pct>=90?"能自然完成這個情境。":pct>=75?"已能完成任務，再修正較生硬的說法。":"建議依回饋再練一次。"}</p>${mistakes.map(m=>`<div class="feedback bad"><b>${m[0]}</b><br>👨‍🏫 ${m[3]}</div>`).join("")}<button class="again" onclick="start()">🔄 再練一次</button></div>`}
["level","train"].forEach(x=>$(x).onchange=()=>{tabs();let a=keys();if(a.length)start(a[0])});$("mode").onchange=()=>start();if("speechSynthesis"in window) speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();tabs();start();
</script><script>
/* 全站共用學習摘要：roleplay */
(function(){const K="jlptLearningCenterProgressV1";function sync(){try{const shared=JSON.parse(localStorage.getItem(K)||"{}");const raw=localStorage.getItem("roleplayProV2")||"";let d={};try{d=JSON.parse(raw||"{}")}catch{}const completed=d.s?Object.keys(d.s).length:0;const wrong=d.w?Object.keys(d.w).length:0;shared.roleplay={updatedAt:new Date().toISOString(),hasRecord:!!raw,completed,wrongCount:wrong,summary:raw?`已有情境實戰紀錄${completed?`・完成 ${completed} 情境`:""}${wrong?`・待加強 ${wrong}`:""}`:"尚未開始角色扮演"};localStorage.setItem(K,JSON.stringify(shared))}catch(e){}}window.addEventListener("pagehide",sync);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")sync()});setTimeout(sync,300)})();
</script>
