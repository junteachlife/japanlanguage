            margin-bottom: 5px;

            font-weight: bold;
            margin-bottom: 20px;
            color: #b71c1c;
            line-height: 1.6;

            display: flex;

            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            padding: 15px;
            font-size: 17px;
            border: 2px solid #ffcdd2;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #ffebee;
            border-color: var(--primary-color);
        }
        .progress-bar {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            font-weight: bold;
        }

            display: none;
        }

            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0;
        }
        .restart-btn {
            padding: 12px 30px;
            font-size: 18px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            display: block;
            margin: 20px auto 0 auto;
        }
        .restart-btn:hover {
            background-color: #b71c1c;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #c62828;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .review-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .review-item {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .review-item.correct {
            border-left: 6px solid #4CAF50;
            background: #f1f8e9;
        }
        .review-item.wrong {
            border-left: 6px solid #f44336;
            background: #ffebee;
        }
        .review-q {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;

        let activeQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];

        // 核心抽選機制：從五大模組各抽 4 題，共 20 題
        function initExam() {
            // 將 150 題依所屬 part 分組
            const partsMap = {};
            fullQuestionBank.forEach(q => {
                if (!partsMap[q.part]) partsMap[q.part] = [];
                partsMap[q.part].push(q);
            });

            activeQuestions = [];
            // 對每一個模組隨機抽 4 題
            for (let partName in partsMap) {
                const shuffledPart = [...partsMap[partName]].sort(() => Math.random() - 0.5);
                const selectedFromPart = shuffledPart.slice(0, 4); // 每模組 4 題，5個模組共 20 題
                activeQuestions.push(...selectedFromPart);
            }

            // 將這 20 題再打散排序
            activeQuestions.sort(() => Math.random() - 0.5);

            currentIndex = 0;
            score = 0;
            userAnswers = [];
            
            document.getElementById('examSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIndex >= activeQuestions.length) {
                showResult();
                return;
            }

            const current = activeQuestions[currentIndex];
            document.getElementById('progressBar').innerText = `[模組：${current.part}] 題目：${currentIndex + 1} / ${activeQuestions.length}`;
            document.getElementById('questionBox').innerText = current.q;

            const optionsGrid = document.getElementById('examOptions');
            optionsGrid.innerHTML = '';
            
            current.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
                btn.onclick = () => selectAnswer(idx);
                optionsGrid.appendChild(btn);
            });
        }

        function selectAnswer(selectedIdx) {
            userAnswers.push({
                questionObj: activeQuestions[currentIndex],
                selectedIndex: selectedIdx
            });

            // 每題 5 分，共 20 題 = 100 分
            if (selectedIdx === activeQuestions[currentIndex].correct) {
                score += 5;
            }
            currentIndex++;
            loadQuestion();
        }

        function showResult() {
            document.getElementById('examSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('finalScore').innerText = `${score} 分`;

            let comment = "";
            if (score >= 90) {
                comment = "🏆 太神了！擁有官方 N5 合格的高標實力，五大模組全方位通關！";
            } else if (score >= 70) {
                comment = "👍 表現很棒！基礎扎實，再複習一下錯題就萬無一失了！";
            } else {
                comment = "💡 還需要多加練習喔！請參考下方的詳細回顧，加強不熟悉的模組觀念。";
            }
            document.getElementById('resultComment').innerText = comment;

            const reviewContainer = document.getElementById('reviewContainer');
            reviewContainer.innerHTML = '';

            userAnswers.forEach((ans, index) => {
                const q = ans.questionObj;
                const isCorrect = ans.selectedIndex === q.correct;
                const userOptText = q.options[ans.selectedIndex];
                const correctOptText = q.options[q.correct];

                const itemDiv = document.createElement('div');
                itemDiv.className = `review-item ${isCorrect ? 'correct' : 'wrong'}`;
                itemDiv.innerHTML = `
                    <div class="review-q">第 ${index + 1} 題 [${q.part}]：${q.q}</div>
                    <div class="review-details">
                        你的選擇：<span style="font-weight:bold; color:${isCorrect ? '#2e7d32' : '#c62828'};">${String.fromCharCode(65 + ans.selectedIndex)}. ${userOptText}</span> ${isCorrect ? '⭕' : '❌'}<br>
                        ${!isCorrect ? `正確解答：<span style="font-weight:bold; color:#2e7d32;">${String.fromCharCode(65 + q.correct)}.${correctOptText}</span><br>` : ''}
                    </div>
                `;
                reviewContainer.appendChild(itemDiv);
            });
        }

        function restartExam() {
            initExam();
        }

        // 初始化
        initExam();
